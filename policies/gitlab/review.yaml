version: 1

# Sandbox policy for the review agent (GitLab forge).
#
# Read-only agent: needs GitLab API for MR data and Vertex AI for inference.
# No write access to GitLab — the post-script handles mutations on the
# runner with a separate write-scoped token.
# gh excluded from the binary allowlist — only curl is permitted for
# GitLab API access.

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  vertex_ai:
    name: vertex-ai
    endpoints:
      - host: "api.anthropic.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
      - host: "*.googleapis.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: "**/claude"
      - path: "**/pi"
      - path: "**/node"

  gitlab_api:
    name: gitlab-api
    endpoints:
      - host: "gitlab.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
        allow_encoded_slash: true
      # Red Hat internal GitLab — supported deployment target for enrolled repos
      - host: "gitlab.cee.redhat.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
        allow_encoded_slash: true
    binaries:
      - path: "**/curl"
      - path: "**/node"
