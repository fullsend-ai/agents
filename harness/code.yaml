---
# harness/code.yaml — code agent with pre/post script pipeline.
#
# Flow: pre_script → sandbox (agent) → post_script
#   pre_script  : validates inputs on the runner BEFORE sandbox creation
#   agent       : reads the issue, implements, tests, scans, commits locally
#   post_script : secret scan, pre-commit, push branch, create PR/MR, assign human
#
# The agent NEVER pushes or creates PRs/MRs as the sandbox policy does not allow
# it.
agent: agents/code.md
doc: docs/code.md
model: opus
# Reasoning effort (low|medium|high|xhigh|max), pinned to what the fleet
# already ran at implicitly: Claude Code's default effort is high on every
# effort-capable model except Opus 4.7 (xhigh) — code.claude.com/docs/en/
# model-config — and the fullsend pi runtime passes --thinking high when
# effort is unset (internal/runtime/pi_run.go piDefaultThinking). Revisit
# when the model: above moves to a generation with a different default.
effort: high
image: ghcr.io/fullsend-ai/fullsend-code@sha256:1f5b5d40a6ee3a5a9e51ff6d1e602c9ff71571aa5f6f14913cc53153348caff9
policy: policies/base.yaml
providers:
  - vertex-ai
  - package-registries
  - gitleaks
  - openai

role: coder
slug: fullsend-ai-coder

# CEL dispatch trigger (docs/guides/user/cel-triggers-reference.md in
# fullsend). Matches the event selection of the code routing in fullsend's
# reusable-dispatch.yml: a /fs-code comment from a human on a work item, or
# the ready-to-code label added to a work item, by a human or a bot (triage
# applies it on promotion). Work items come from GitHub issues, GitLab
# issues or Jira, so a Jira poller that dispatches code matches the same
# events. A GitHub PR comment arrives as a work_item with
# entity.linked_change_proposal set, and a GitLab MR note as a
# change_proposal; neither matches, as /fs-code is for issues only.
# Authorization stays with the platform gate and its per-harness threshold,
# so this expression has no role checks.
# harness/triggertest/trigger_test.go evaluates this against the
# NormalizedEvent fixtures.
trigger: >
  event.entity.kind == "work_item"
    && !has(event.entity.linked_change_proposal)
    && event.source.system in ["github", "gitlab", "jira"]
    && ((event.transition.kind == "comment_added"
        && has(event.transition.comment.command)
        && event.transition.comment.command == "/fs-code"
        && event.actor.kind == "human")
      || (event.transition.kind == "label_changed"
        && event.transition.label.name == "ready-to-code"
        && event.transition.label.action == "added"))

host_files:
  - src: env/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: env/ssl-cainfo.env
    dest: /sandbox/workspace/.env.d/ssl-cainfo.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
    optional: true
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /sandbox/workspace/.gcp-oidc-token
    optional: true

pre_script: scripts/pre-code.sh
post_script: scripts/post-code.sh

skills:
  - skills/code-implementation

plugins:
  - plugins/gopls-lsp

validation_loop:
  script: scripts/validate-code-output.sh
  preflight_check: 'python3 -c "import jsonschema"'
  schema: schemas/code-result.schema.json
  max_iterations: 2
  feedback_mode: append

# Environment variables for runner pre/post scripts and sandbox sessions.
env:
  runner:
    TARGET_REPO_DIR: "${TARGET_REPO_DIR}"
    PUSH_TOKEN: "${PUSH_TOKEN}"
    PUSH_TOKEN_SOURCE: "${PUSH_TOKEN_SOURCE}"
    REPO_FULL_NAME: "${REPO_FULL_NAME}"
    ISSUE_NUMBER: "${ISSUE_NUMBER}"
  sandbox:
    MAX_RETRIES: "1"
    # Mirror of timeout_minutes. The code-implementation skill budgets
    # its tail from it. Keep the two in sync.
    TIMEOUT_SECONDS: "3600"
    GOPATH: "/sandbox/go"
    GOMODCACHE: "/sandbox/go/pkg/mod"
    GIT_AUTHOR_NAME: "fullsend-code"
    GIT_AUTHOR_EMAIL: "${GIT_BOT_EMAIL}"
    GIT_COMMITTER_NAME: "fullsend-code"
    GIT_COMMITTER_EMAIL: "${GIT_BOT_EMAIL}"

# Per iteration. Mirrored as TIMEOUT_SECONDS in env.sandbox.
timeout_minutes: 60

overlays:
  - when: 'runtime.forge == "github"'
    providers:
      - providers/github-code.yaml
    openshell:
      profiles:
        - profiles/fullsend-github-code.yaml
    skills:
      - skills/github-forge
    host_files:
      - src: env/github/code.env
        dest: /sandbox/workspace/.env.d/forge-code.env
        expand: true
    env:
      runner:
        ISSUE_URL: "${GITHUB_ISSUE_URL}"
        GH_TOKEN: "${GH_TOKEN}"
        FULLSEND_FORGE: github
        # "true" publishes the branch through the Git Data API so GitHub
        # signs the commits (docs/code.md "Signed commits"); anything else
        # is a plain git push. Override per repo via base: composition.
        GITHUB_SIGNED_COMMITS: "false"
      sandbox:
        ISSUE_NUMBER: "${ISSUE_NUMBER}"
        ISSUE_URL: "${GITHUB_ISSUE_URL}"
        FULLSEND_FORGE: github
  - when: 'runtime.forge == "gitlab"'
    providers:
      - providers/gitlab-code.yaml
    openshell:
      profiles:
        - profiles/fullsend-gitlab-code.yaml
    skills:
      - skills/gitlab-forge
    host_files:
      - src: env/gitlab/code.env
        dest: /sandbox/workspace/.env.d/forge-code.env
        expand: true
    env:
      runner:
        ISSUE_URL: "${GITLAB_ISSUE_URL}"
        GITLAB_TOKEN: "${GITLAB_TOKEN}"
        FULLSEND_FORGE: gitlab
      sandbox:
        ISSUE_NUMBER: "${ISSUE_NUMBER}"
        ISSUE_URL: "${GITLAB_ISSUE_URL}"
        FULLSEND_FORGE: gitlab
  # Jira-source overlay — provides provider-backed Jira API access so
  # the sandbox can read work items directly through the credential
  # boundary.  Ordered AFTER forge overlays so its env vars (especially
  # ISSUE_URL) win under last-writer-wins merge semantics when both the
  # Jira overlay and a forge overlay match.
  # pre_script overrides the top-level default.  Post-script selection
  # stays with the target forge (GitHub/GitLab).
  # has(event.source) guards the field access: on non-Jira runs event is
  # present but has no source, and unguarded event.source throws CEL
  # "no such key: source" instead of skipping the overlay.
  - when: 'has(event.source) && event.source.system == "jira"'
    providers:
      - providers/jira-ro.yaml
    openshell:
      profiles:
        - profiles/fullsend-jira-ro.yaml
    pre_script: scripts/pre-code-jira.sh
    env:
      runner:
        JIRA_BASE_URL: "${JIRA_BASE_URL}"
        # Runner-only Jira credentials: post-code writes the code-stage
        # update and PR/MR URL to the Jira issue. The sandbox never gets the
        # real token (the jira-ro provider supplies a placeholder).
        JIRA_USER_EMAIL: "${JIRA_USER_EMAIL}"
        JIRA_TOKEN: "${JIRA_TOKEN}"
        ISSUE_URL: "${FULLSEND_WORK_ITEM_URL}"
        # A Jira source work item has a key, not a target-forge issue number.
        # Override the inherited compatibility variable so harness expansion
        # does not require ISSUE_NUMBER for cross-forge runs.
        ISSUE_NUMBER: ""
        FULLSEND_TRACKER: jira
      sandbox:
        FULLSEND_TRACKER: jira
        ISSUE_NUMBER: ""
        ISSUE_URL: "${FULLSEND_WORK_ITEM_URL}"
        JIRA_USER_EMAIL: "${JIRA_USER_EMAIL}"
        JIRA_BASE_URL: "${JIRA_BASE_URL}"
