---
agent: agents/triage.md
doc: docs/triage.md
model: opus
# Reasoning effort (low|medium|high|xhigh|max), pinned to what the fleet
# already ran at implicitly: Claude Code's default effort is high on every
# effort-capable model except Opus 4.7 (xhigh) — code.claude.com/docs/en/
# model-config — and the fullsend pi runtime passes --thinking high when
# effort is unset (internal/runtime/pi_run.go piDefaultThinking). Revisit
# when the model: above moves to a generation with a different default.
effort: high
image: ghcr.io/fullsend-ai/fullsend-sandbox@sha256:b77fbc74f4795c948de0dfb8f6dac0c5853aeaaa48b30045b2857e0f075e2fd2
policy: policies/base.yaml
providers:
  - vertex-ai
  - openai

role: triage
slug: fullsend-ai-triage

# CEL dispatch trigger (docs/guides/user/cel-triggers-reference.md in
# fullsend). Matches the event selection of the triage routing in fullsend's
# reusable-dispatch.yml: an issue opened or edited by a human; the
# ready-for-triage label added to an issue, by a human or a bot (post-triage
# labels the sub-issues it creates); or a /fs-triage comment from a human on
# an issue, a PR or an MR (a GitHub PR comment arrives as a work_item, a
# GitLab MR note as a change_proposal). Authorization stays with the platform
# gate, so this expression has no role checks. The human guard on opened,
# edited and /fs-triage keeps the triage bot's own sub-issues, edits and
# comments from triaging again once the gate recognizes fullsend bots;
# post-triage already avoids issue edits for the same reason. The expression
# is forge-neutral, so a Jira poller that dispatches triage also matches Jira
# issues opened or edited. harness/triggertest/trigger_test.go evaluates this
# against the NormalizedEvent fixtures.
trigger: >
  (event.entity.kind == "work_item"
    && event.transition.kind in ["opened", "edited"]
    && event.actor.kind == "human")
  || (event.entity.kind == "work_item"
    && event.transition.kind == "label_changed"
    && event.transition.label.name == "ready-for-triage"
    && event.transition.label.action == "added")
  || (event.entity.kind in ["work_item", "change_proposal"]
    && event.transition.kind == "comment_added"
    && has(event.transition.comment.command)
    && event.transition.comment.command == "/fs-triage"
    && event.actor.kind == "human")

host_files:
  - src: env/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
    optional: true
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /sandbox/workspace/.gcp-oidc-token
    optional: true

pre_script: scripts/pre-triage.sh
post_script: scripts/post-triage.sh

validation_loop:
  script: scripts/validate-output-schema.sh
  preflight_check: 'python3 -c "import jsonschema"'
  schema: schemas/triage-result.schema.json
  max_iterations: 2

timeout_minutes: 10

env:
  # TRIAGE_AUTO_CODE is read by both the agent (sandbox) and the post-script
  # (runner). Keep the two in sync so discretionary mode is visible to the
  # agent and enforced by the post-script. Override via base: composition.
  runner:
    TRIAGE_AUTO_CODE: "on"
    TRIAGE_AUTO_CODE_CATEGORIES: "bug,documentation,performance"
  sandbox:
    TRIAGE_AUTO_CODE: "on"
    TRIAGE_AUTO_CODE_CATEGORIES: "bug,documentation,performance"

overlays:
  - when: '(has(event.source) && event.source.system == "github") || (!has(event.source) && runtime.forge == "github")'
    providers:
      - github-ro
    skills:
      - skills/github-forge
      - skills/issue-labels/github
    host_files:
      - src: env/github/triage.env
        dest: /sandbox/workspace/.env.d/triage.env
        expand: true
    env:
      runner:
        ISSUE_URL: ${GITHUB_ISSUE_URL}
        GH_TOKEN: ${GH_TOKEN}
        FULLSEND_FORGE: github
      sandbox:
        ISSUE_URL: "${GITHUB_ISSUE_URL}"
        FULLSEND_FORGE: github
  - when: '(has(event.source) && event.source.system == "gitlab") || (!has(event.source) && runtime.forge == "gitlab")'
    providers:
      - providers/gitlab-rw.yaml
    openshell:
      profiles:
        - profiles/fullsend-gitlab-rw.yaml
    skills:
      - skills/gitlab-forge
      - skills/issue-labels/gitlab
    host_files:
      - src: env/gitlab/triage.env
        dest: /sandbox/workspace/.env.d/triage.env
        expand: true
    env:
      runner:
        ISSUE_URL: ${GITLAB_ISSUE_URL}
        GITLAB_TOKEN: ${GITLAB_TOKEN}
        FULLSEND_FORGE: gitlab
      sandbox:
        ISSUE_URL: "${GITLAB_ISSUE_URL}"
        FULLSEND_FORGE: gitlab
  - when: '(has(event.source) && event.source.system == "jira") || (!has(event.source) && runtime.forge == "jira")'
    providers:
      - providers/jira-ro.yaml
    openshell:
      profiles:
        - profiles/fullsend-jira-ro.yaml
    skills:
      - skills/jira-forge
      - skills/issue-labels/jira
      - skills/jira-components
    host_files:
      - src: env/jira/triage.env
        dest: /sandbox/workspace/.env.d/triage.env
        expand: true
    env:
      runner:
        ISSUE_URL: ${FULLSEND_WORK_ITEM_URL}
        JIRA_USER_EMAIL: ${JIRA_USER_EMAIL}
        JIRA_TOKEN: ${JIRA_TOKEN}
        JIRA_BASE_URL: ${JIRA_BASE_URL}
        JIRA_DUPLICATE_TRANSITION: "Duplicate"
        JIRA_NOT_PLANNED_TRANSITION: "Won't Do"
        JIRA_SPLIT_TRANSITION: "Obsolete"
        FULLSEND_FORGE: jira
      sandbox:
        ISSUE_URL: "${FULLSEND_WORK_ITEM_URL}"
        JIRA_USER_EMAIL: "${JIRA_USER_EMAIL}"
        JIRA_BASE_URL: "${JIRA_BASE_URL}"
        FULLSEND_FORGE: jira
