---
agent: agents/retro.md
doc: docs/retro.md
model: opus
image: ghcr.io/fullsend-ai/fullsend-sandbox@sha256:eaf365ad038d762954d8fd5f41618cd6766a8a6a6f76d944aaf160819666734d
policy: policies/base.yaml
openshell:
  profiles:
    - profiles/fullsend-vertex-ai.yaml
providers:
  - providers/vertex-ai.yaml

role: retro
slug: fullsend-ai-retro

host_files:
  - src: env/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /sandbox/workspace/.gcp-oidc-token
    optional: true

skills:
  - skills/retro-analysis
  - skills/finding-agent-runs
  - skills/agent-scaffolding
  - skills/autonomy-readiness

pre_script: scripts/pre-retro.sh
post_script: scripts/post-retro.sh

validation_loop:
  script: scripts/validate-output-schema.sh
  schema: schemas/retro-result.schema.json
  max_iterations: 2

timeout_minutes: 30

forge:
  github:
    providers:
      - providers/github-ro.yaml
      - providers/github-artifacts.yaml
    openshell:
      profiles:
        - profiles/fullsend-github-ro.yaml
        - profiles/fullsend-github-artifacts.yaml
    pre_script: scripts/pre-retro.sh
    post_script: scripts/post-retro.sh
    env:
      runner:
        ORIGINATING_URL: "${ORIGINATING_URL}"
        REPO_FULL_NAME: "${REPO_FULL_NAME}"
        GH_TOKEN: "${GH_TOKEN}"
      sandbox:
        ORIGINATING_URL: "${ORIGINATING_URL}"
        RETRO_COMMENT: "${RETRO_COMMENT}"
        REPO_FULL_NAME: "${REPO_FULL_NAME}"
        GH_TOKEN: "${GH_TOKEN}"
