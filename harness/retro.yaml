---
agent: agents/retro.md
doc: docs/retro.md
model: opus
# Reasoning effort (low|medium|high|xhigh|max). Set explicitly so a runtime
# default change cannot silently move it: Claude Code runs at high on Vertex
# and the pi runtime maps effort onto --thinking (high when unset).
effort: high
image: ghcr.io/fullsend-ai/fullsend-sandbox@sha256:9af3fba87d193bc58ae9da6c916fcc9689176eeee9247b563bc14d8acb3cc734
policy: policies/base.yaml
openshell:
  profiles:
    - profiles/fullsend-vertex-ai.yaml
providers:
  - providers/vertex-ai.yaml

role: retro
slug: fullsend-ai-retro

host_files:
  - src: env/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /sandbox/workspace/.gcp-oidc-token
    optional: true

skills:
  - skills/retro-analysis
  - skills/finding-agent-runs
  - skills/agent-scaffolding
  - skills/autonomy-readiness

pre_script: scripts/pre-retro.sh
post_script: scripts/post-retro.sh

env:
  runner:
    ORIGINATING_URL: "${ORIGINATING_URL}"
    REPO_FULL_NAME: "${REPO_FULL_NAME}"
  sandbox:
    ORIGINATING_URL: "${ORIGINATING_URL}"
    RETRO_COMMENT: "${RETRO_COMMENT}"
    REPO_FULL_NAME: "${REPO_FULL_NAME}"

validation_loop:
  script: scripts/validate-output-schema.sh
  schema: schemas/retro-result.schema.json
  max_iterations: 2

timeout_minutes: 30

forge:
  github:
    providers:
      - providers/github-ro.yaml
      - providers/github-artifacts.yaml
    openshell:
      profiles:
        - profiles/fullsend-github-ro.yaml
        - profiles/fullsend-github-artifacts.yaml
    skills:
      - skills/github-forge
      - skills/retro-analysis/github
      - skills/finding-agent-runs/github
    host_files:
      - src: env/github/retro.env
        dest: /sandbox/workspace/.env.d/retro.env
        expand: true
    env:
      runner:
        GH_TOKEN: "${GH_TOKEN}"
        FULLSEND_FORGE: github
      sandbox:
        GH_TOKEN: "${GH_TOKEN}"
        FULLSEND_FORGE: github
  gitlab:
    policy: policies/gitlab/retro.yaml
    skills:
      - skills/gitlab-forge
      - skills/retro-analysis/gitlab
      - skills/finding-agent-runs/gitlab
    host_files:
      - src: env/gitlab/retro.env
        dest: /sandbox/workspace/.env.d/retro.env
        expand: true
    env:
      runner:
        GITLAB_TOKEN: "${GITLAB_TOKEN}"
        FULLSEND_FORGE: gitlab
      sandbox:
        GITLAB_TOKEN: "${GITLAB_TOKEN}"
        FULLSEND_FORGE: gitlab
