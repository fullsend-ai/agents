---
agent: agents/retro.md
doc: docs/retro.md
model: opus
# Reasoning effort (low|medium|high|xhigh|max), pinned to what the fleet
# already ran at implicitly: Claude Code's default effort is high on every
# effort-capable model except Opus 4.7 (xhigh) — code.claude.com/docs/en/
# model-config — and the fullsend pi runtime passes --thinking high when
# effort is unset (internal/runtime/pi_run.go piDefaultThinking). Revisit
# when the model: above moves to a generation with a different default.
effort: high
image: ghcr.io/fullsend-ai/fullsend-sandbox@sha256:dd6437dbaacabb3b7f866274601918d61745b89bbeea9e1aaae000fe468690cc
policy: policies/base.yaml
providers:
  - vertex-ai
  - openai

role: retro
slug: fullsend-ai-retro

# CEL dispatch trigger (docs/guides/user/cel-triggers-reference.md in
# fullsend). Matches the event selection of the retro routing in fullsend's
# reusable-dispatch.yml: a PR closed, merged or not; or a /fs-retro comment
# from a human on an issue or a PR/MR. Authorization stays with the platform
# gate, so this expression has no role checks: /fs-retro needs write, and the
# close arm has no actor check because fullsend's authorization contract lets
# any closer start a retro (its lifecycle-close exception). The gate does not
# grant that exception on the CEL path yet; until it does, only a closer with
# write access starts a retro there. Discussion and Jira comments never
# reached the retro routing, so the comment arm leaves them out.
# harness/triggertest/trigger_test.go evaluates this against the
# NormalizedEvent fixtures.
trigger: >
  (event.entity.kind == "change_proposal"
    && event.transition.kind in ["closed", "merged"])
  || (event.transition.kind == "comment_added"
    && has(event.transition.comment.command)
    && event.transition.comment.command == "/fs-retro"
    && event.actor.kind == "human"
    && event.source.system in ["github", "gitlab"]
    && event.entity.kind in ["work_item", "change_proposal"])

host_files:
  - src: env/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
    optional: true
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /sandbox/workspace/.gcp-oidc-token
    optional: true

skills:
  - skills/retro-analysis
  - skills/finding-agent-runs
  - skills/agent-scaffolding
  - skills/autonomy-readiness

pre_script: scripts/pre-retro.sh
post_script: scripts/post-retro.sh

env:
  runner:
    ORIGINATING_URL: "${ORIGINATING_URL}"
    REPO_FULL_NAME: "${REPO_FULL_NAME}"
  sandbox:
    ORIGINATING_URL: "${ORIGINATING_URL}"
    RETRO_COMMENT: "${RETRO_COMMENT}"
    REPO_FULL_NAME: "${REPO_FULL_NAME}"

validation_loop:
  script: scripts/validate-output-schema.sh
  preflight_check: 'python3 -c "import jsonschema"'
  schema: schemas/retro-result.schema.json
  max_iterations: 2

timeout_minutes: 30

forge:
  github:
    providers:
      - github-ro
      - github-artifacts
    skills:
      - skills/github-forge
      - skills/retro-analysis/github
      - skills/finding-agent-runs/github
    host_files:
      - src: env/github/retro.env
        dest: /sandbox/workspace/.env.d/retro.env
        expand: true
    env:
      runner:
        GH_TOKEN: "${GH_TOKEN}"
        FULLSEND_FORGE: github
      sandbox:
        FULLSEND_FORGE: github
  gitlab:
    providers:
      - providers/gitlab-ro.yaml
    openshell:
      profiles:
        - profiles/fullsend-gitlab-ro.yaml
    skills:
      - skills/gitlab-forge
      - skills/retro-analysis/gitlab
      - skills/finding-agent-runs/gitlab
    host_files:
      - src: env/gitlab/retro.env
        dest: /sandbox/workspace/.env.d/retro.env
        expand: true
    env:
      runner:
        GITLAB_TOKEN: "${GITLAB_TOKEN}"
        FULLSEND_FORGE: gitlab
      sandbox:
        FULLSEND_FORGE: gitlab
