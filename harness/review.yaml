---
agent: agents/review.md
doc: docs/review.md
model: opus
image: ghcr.io/fullsend-ai/fullsend-code@sha256:de3ecbd7719a1927c983142ada96475f3314d2505d0f258bcf19c31411856eb6
policy: policies/review.yaml
readonly_repo: true

role: review
slug: fullsend-ai-review

skills:
  - skills/pr-review
  - skills/code-review
  - skills/docs-review
  - skills/issue-labels

host_files:
  - src: common/env/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /sandbox/workspace/.gcp-oidc-token
    optional: true
  - src: env/review.env
    dest: /sandbox/workspace/.env.d/review.env
    expand: true
  - src: ${PRIOR_REVIEW_FILE}
    dest: /sandbox/workspace/prior-review.txt
    optional: true

pre_script: scripts/pre-review.sh
post_script: scripts/post-review.sh

validation_loop:
  script: scripts/validate-output-schema.sh
  schema: schemas/review-result.schema.json
  max_iterations: 2

env:
  # REVIEW_FINDING_SEVERITY_THRESHOLD is set independently for runner and
  # sandbox — they're allowed to differ, but if they do, findings may be
  # filtered inconsistently between the agent's own output and the
  # post-script's defense-in-depth filter. Best practice is to keep them
  # in sync.
  runner:
    REVIEW_FINDING_SEVERITY_THRESHOLD: "low"
  sandbox:
    REVIEW_FINDING_SEVERITY_THRESHOLD: "low"

timeout_minutes: 20

forge:
  github:
    pre_script: scripts/pre-review.sh
    post_script: scripts/post-review.sh
    env:
      runner:
        REVIEW_TOKEN: "${REVIEW_TOKEN}"
        REPO_FULL_NAME: "${REPO_FULL_NAME}"
        PR_NUMBER: "${PR_NUMBER}"
        GITHUB_PR_URL: "${GITHUB_PR_URL}"
