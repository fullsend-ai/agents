---
agent: agents/review.md
doc: docs/review.md
model: opus
image: ghcr.io/fullsend-ai/fullsend-code@sha256:de3ecbd7719a1927c983142ada96475f3314d2505d0f258bcf19c31411856eb6
policy: policies/base.yaml
readonly_repo: true
openshell:
  profiles:
    - profiles/fullsend-vertex-ai.yaml
providers:
  - providers/vertex-ai.yaml

role: review
slug: fullsend-ai-review

skills:
  - skills/pr-review
  - skills/code-review
  - skills/docs-review

host_files:
  - src: env/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /sandbox/workspace/.gcp-oidc-token
    optional: true
  - src: ${PRIOR_REVIEW_FILE}
    dest: /sandbox/workspace/prior-review.txt
    optional: true

validation_loop:
  script: scripts/validate-output-schema.sh
  schema: schemas/review-result.schema.json
  max_iterations: 2

env:
  # REVIEW_FINDING_SEVERITY_THRESHOLD and REVIEW_PROTECTED_PATHS are set
  # independently for runner and sandbox — they're allowed to differ, but
  # if they do, findings/enforcement may be inconsistent between the
  # agent's own output and the post-script's defense-in-depth filter.
  # Best practice is to keep them in sync. Repos needing different values
  # override these keys via harness `base:` composition.
  runner:
    REVIEW_FINDING_SEVERITY_THRESHOLD: "low"
    REVIEW_PROTECTED_PATHS: ".claude/,.cursor/,.gitattributes,.github/,.pre-commit-config.yaml,AGENTS.md,agents/,api-servers/,CLAUDE.md,CODEOWNERS,Containerfile,Dockerfile,harness/,images/,plugins/,policies/,profiles/,providers/,scripts/,skills/"
  sandbox:
    REVIEW_FINDING_SEVERITY_THRESHOLD: "low"
    REVIEW_PROTECTED_PATHS: ".claude/,.cursor/,.gitattributes,.github/,.pre-commit-config.yaml,AGENTS.md,agents/,api-servers/,CLAUDE.md,CODEOWNERS,Containerfile,Dockerfile,harness/,images/,plugins/,policies/,profiles/,providers/,scripts/,skills/"

timeout_minutes: 20

forge:
  github:
    providers:
      - providers/github-ro.yaml
    openshell:
      profiles:
        - profiles/fullsend-github-ro.yaml
    policy: policies/github/review.yaml
    pre_script: scripts/pre-review.sh
    post_script: scripts/post-review.sh
    skills:
      - skills/github-forge
      - skills/issue-labels/github
      - skills/pr-review/github
    host_files:
      - src: env/github/review.env
        dest: /sandbox/workspace/.env.d/review.env
        expand: true
    env:
      runner:
        REVIEW_TOKEN: "${REVIEW_TOKEN}"
        REPO_FULL_NAME: "${REPO_FULL_NAME}"
        PR_NUMBER: "${PR_NUMBER}"
        PR_URL: "${GITHUB_PR_URL}"
        GH_TOKEN: "${GH_TOKEN}"
        FULLSEND_FORGE: github
      sandbox:
        REPO_FULL_NAME: "${REPO_FULL_NAME}"
        PR_NUMBER: "${PR_NUMBER}"
        PR_URL: "${GITHUB_PR_URL}"
        GH_TOKEN: "${GH_TOKEN}"
        FULLSEND_FORGE: github
        PRIOR_REVIEW_SHA: "${PRIOR_REVIEW_SHA}"
        PRIOR_REVIEW_PROVENANCE: "${PRIOR_REVIEW_PROVENANCE}"
  gitlab:
    policy: policies/gitlab/review.yaml
    pre_script: scripts/pre-review.sh
    post_script: scripts/post-review.sh
    skills:
      - skills/gitlab-forge
      - skills/issue-labels/gitlab
      - skills/pr-review/gitlab
    host_files:
      - src: env/gitlab/review.env
        dest: /sandbox/workspace/.env.d/review.env
        expand: true
    env:
      runner:
        REVIEW_TOKEN: "${GITLAB_TOKEN}"
        REPO_FULL_NAME: "${REPO_FULL_NAME}"
        PR_NUMBER: "${MR_NUMBER}"
        PR_URL: "${GITLAB_MR_URL}"
        GITLAB_TOKEN: "${GITLAB_TOKEN}"
        FULLSEND_FORGE: gitlab
      sandbox:
        REPO_FULL_NAME: "${REPO_FULL_NAME}"
        PR_NUMBER: "${MR_NUMBER}"
        PR_URL: "${GITLAB_MR_URL}"
        GITLAB_TOKEN: "${GITLAB_TOKEN}"
        FULLSEND_FORGE: gitlab
        PRIOR_REVIEW_SHA: "${PRIOR_REVIEW_SHA}"
        PRIOR_REVIEW_PROVENANCE: "${PRIOR_REVIEW_PROVENANCE}"
