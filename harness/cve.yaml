# harness/cve.yaml — DRAFT.
#
# Assess one public CVE named by a Jira work item against the maintained
# branch its intake maps to, and record the verdict and a remediation plan on
# the work item. It never changes code. A person's /fs-code comment hands an
# affected verdict with a ready plan to the code agent (see the cve overlay in
# harness/code.yaml).
#
# This is the CVE workflow from fullsend-playground/cve-workflow-experiment
# (its prompt, cve-security skill, schema and host gates), run as an ordinary
# Fullsend agent:
#
#   trigger     : a person's /fs-cve-triage comment on a Jira Task, Bug or
#                 Vulnerability (the Jira poller starts it; no launch step)
#   pre_script  : disclosure and intake gates, then the release mapping picks
#                 one repository and branch, which is checked out and verified
#   agent       : the cve prompt and cve-security skill, read-only checkout
#   post_script : the validated result is stored as the fullsend.cve.assessment
#                 issue property and posted as a comment, after rechecking the
#                 work item
#
# The adopter's settings live in its own repository, not here:
# .fullsend/cve-policy.json and the release mapping file it names. See
# docs/cve.md.
base: https://raw.githubusercontent.com/fullsend-ai/agents/62f25ace461b9c11a712bf5762f6e881892e4b74/harness/triage.yaml#sha256=bf4cd9cca1bb15d7849fbe236bc7c6f83db67c9005f8ec53ec929902c592416f
agent: agents/cve.md
doc: docs/cve.md
# The code image carries the language toolchains the assessment runs (Python,
# Node/npm, Go) for its bounded local reproducer.
image: ghcr.io/fullsend-ai/fullsend-code@sha256:c9c384db0f2790226364788a1504c6e49fa7e857c03b74b11f0c931835d7ae50
policy: policies/cve-assess.yaml
readonly_repo: true
pre_script: scripts/pre-cve-assess.sh
post_script: scripts/post-cve-assess.sh
skills:
  - skills/cve-security
providers:
  - package-registries
host_files:
  # Written by the pre-script: the admitted intake, mapping and checkout
  # checks. Only normalized, scope-checked metadata is staged.
  - src: ${TARGET_REPO_DIR}/.cve-context.json
    dest: /sandbox/workspace/cve-context.json
validation_loop:
  script: scripts/validate-cve-assess.sh
  schema: scripts/cve/cve-assessment.schema.json
  preflight_check: 'python3 -c "import jsonschema, yaml"'
  max_iterations: 2
  feedback_mode: append

# A person with write access comments /fs-cve-triage. The issue types are the
# ones this workflow accepts; they are names on the Jira site, so an adopter
# with other names restates the trigger in a harness that composes this one.
trigger: >-
  event.source.system == "jira"
    && event.entity.kind == "work_item"
    && event.actor.kind == "human"
    && event.actor.role in ["write", "admin"]
    && event.transition.kind == "comment_added"
    && has(event.transition.comment.command)
    && event.transition.comment.command == "/fs-cve-triage"
    && has(event.state.issue_type)
    && event.state.issue_type.name in ["Task", "Bug", "Vulnerability"]

env:
  runner:
    TRIAGE_AUTO_CODE: "off"
    # The adopter's CVE policy: Jira site, release mappings, labels, coding
    # types and change paths.
    CVE_POLICY_FILE: "${FULLSEND_DIR}/cve-policy.json"
    CVE_ISSUE_URL: "${FULLSEND_WORK_ITEM_URL}"
    REPO_FULL_NAME: "${REPO_FULL_NAME}"
    TARGET_REPO_DIR: "${TARGET_REPO_DIR}"
  sandbox:
    TRIAGE_AUTO_CODE: "off"
    GOWORK: "off"
    GOTOOLCHAIN: "local"
    GOCACHE: "/tmp/cve-go-build"
    GOPATH: "/sandbox/go"
    GOMODCACHE: "/sandbox/go/pkg/mod"
