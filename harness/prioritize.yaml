---
agent: agents/prioritize.md
doc: docs/prioritize.md
model: opus
# Reasoning effort (low|medium|high|xhigh|max), pinned to what the fleet
# already ran at implicitly: Claude Code's default effort is high on every
# effort-capable model except Opus 4.7 (xhigh) — code.claude.com/docs/en/
# model-config — and the fullsend pi runtime passes --thinking high when
# effort is unset (internal/runtime/pi_run.go piDefaultThinking). Revisit
# when the model: above moves to a generation with a different default.
effort: high
image: ghcr.io/fullsend-ai/fullsend-sandbox@sha256:b77fbc74f4795c948de0dfb8f6dac0c5853aeaaa48b30045b2857e0f075e2fd2
policy: policies/base.yaml
providers:
  - vertex-ai
  - openai

role: prioritize
slug: fullsend-ai-prioritize

# CEL dispatch trigger (docs/guides/user/cel-triggers-reference.md in
# fullsend). Matches the event selection of the prioritize routing in
# fullsend's reusable-dispatch.yml: a /fs-prioritize comment from a human on
# an issue, a PR or an MR (a GitHub PR comment arrives as a work_item, a
# GitLab MR note as a change_proposal). The scheduled scoring path dispatches
# reusable-prioritize.yml directly and never reaches this trigger.
# Authorization stays with the platform gate and its per-harness threshold
# (fullsend-ai/fullsend#8727), so this expression has no role checks.
# harness/triggertest/trigger_test.go evaluates this against the
# NormalizedEvent fixtures.
trigger: >
  event.entity.kind in ["work_item", "change_proposal"]
    && event.transition.kind == "comment_added"
    && has(event.transition.comment.command)
    && event.transition.comment.command == "/fs-prioritize"
    && event.actor.kind == "human"

host_files:
  - src: env/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
    optional: true
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /sandbox/workspace/.gcp-oidc-token
    optional: true

pre_script: scripts/pre-prioritize.sh
post_script: scripts/post-prioritize.sh

validation_loop:
  script: scripts/validate-output-schema.sh
  preflight_check: 'python3 -c "import jsonschema"'
  schema: schemas/prioritize-result.schema.json
  max_iterations: 2

timeout_minutes: 10

forge:
  github:
    providers:
      - github-ro
    skills:
      - skills/github-forge
    host_files:
      - src: env/github/prioritize.env
        dest: /sandbox/workspace/.env.d/prioritize.env
        expand: true
    env:
      runner:
        ISSUE_URL: ${GITHUB_ISSUE_URL}
        GH_TOKEN: ${GH_TOKEN}
        ORG: ${ORG}
        PROJECT_NUMBER: ${PROJECT_NUMBER}
        FULLSEND_FORGE: github
      sandbox:
        ISSUE_URL: "${GITHUB_ISSUE_URL}"
        FULLSEND_FORGE: github
  gitlab:
    providers:
      - providers/gitlab-ro.yaml
    openshell:
      profiles:
        - profiles/fullsend-gitlab-ro.yaml
    skills:
      - skills/gitlab-forge
    host_files:
      - src: env/gitlab/prioritize.env
        dest: /sandbox/workspace/.env.d/prioritize.env
        expand: true
    env:
      runner:
        ISSUE_URL: ${GITLAB_ISSUE_URL}
        GITLAB_TOKEN: ${GITLAB_TOKEN}
        FULLSEND_FORGE: gitlab
      sandbox:
        ISSUE_URL: "${GITLAB_ISSUE_URL}"
        FULLSEND_FORGE: gitlab
