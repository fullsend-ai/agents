---
agent: agents/prioritize.md
doc: docs/prioritize.md
model: opus
# Reasoning effort (low|medium|high|xhigh|max), pinned to what the fleet
# already ran at implicitly: Claude Code's default effort is high on every
# effort-capable model except Opus 4.7 (xhigh) — code.claude.com/docs/en/
# model-config — and the fullsend pi runtime passes --thinking high when
# effort is unset (internal/runtime/pi_run.go piDefaultThinking). Revisit
# when the model: above moves to a generation with a different default.
effort: high
image: ghcr.io/fullsend-ai/fullsend-sandbox@sha256:f8255971fec8a72a60adb20f501e55098f237e699dc829f0894647c0de2a19c2
policy: policies/base.yaml
openshell:
  profiles:
    - profiles/fullsend-vertex-ai.yaml
providers:
  - providers/vertex-ai.yaml

role: prioritize
slug: fullsend-ai-prioritize

host_files:
  - src: env/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /sandbox/workspace/.gcp-oidc-token
    optional: true

pre_script: scripts/pre-prioritize.sh
post_script: scripts/post-prioritize.sh

validation_loop:
  script: scripts/validate-output-schema.sh
  schema: schemas/prioritize-result.schema.json
  max_iterations: 2

timeout_minutes: 10

forge:
  github:
    providers:
      - providers/github-ro.yaml
    openshell:
      profiles:
        - profiles/fullsend-github-ro.yaml
    skills:
      - skills/github-forge
    host_files:
      - src: env/github/prioritize.env
        dest: /sandbox/workspace/.env.d/prioritize.env
        expand: true
    env:
      runner:
        ISSUE_URL: ${GITHUB_ISSUE_URL}
        GH_TOKEN: ${GH_TOKEN}
        ORG: ${ORG}
        PROJECT_NUMBER: ${PROJECT_NUMBER}
        FULLSEND_FORGE: github
      sandbox:
        ISSUE_URL: "${GITHUB_ISSUE_URL}"
        GH_TOKEN: "${GH_TOKEN}"
        FULLSEND_FORGE: github
  gitlab:
    providers:
      - providers/gitlab-ro.yaml
    openshell:
      profiles:
        - profiles/fullsend-gitlab-ro.yaml
    skills:
      - skills/gitlab-forge
    host_files:
      - src: env/gitlab/prioritize.env
        dest: /sandbox/workspace/.env.d/prioritize.env
        expand: true
    env:
      runner:
        ISSUE_URL: ${GITLAB_ISSUE_URL}
        GITLAB_TOKEN: ${GITLAB_TOKEN}
        FULLSEND_FORGE: gitlab
      sandbox:
        ISSUE_URL: "${GITLAB_ISSUE_URL}"
        GITLAB_TOKEN: "${GITLAB_TOKEN}"
        FULLSEND_FORGE: gitlab
