---
# harness/fix.yaml — fix agent with pre/post script pipeline.
#
# Flow: pre_script → sandbox (agent) → post_script
#   pre_script  : validates inputs, checks iteration cap
#   agent       : reads pre-fetched review body, fixes code, tests, scans, commits
#   post_script : push commit, post summary comment on PR
#
# The agent NEVER pushes or creates PRs/MRs as the sandbox policy does not allow
# it.
agent: agents/fix.md
doc: docs/fix.md
model: opus
# Reasoning effort (low|medium|high|xhigh|max), pinned to what the fleet
# already ran at implicitly: Claude Code's default effort is high on every
# effort-capable model except Opus 4.7 (xhigh) — code.claude.com/docs/en/
# model-config — and the fullsend pi runtime passes --thinking high when
# effort is unset (internal/runtime/pi_run.go piDefaultThinking). Revisit
# when the model: above moves to a generation with a different default.
effort: high
image: ghcr.io/fullsend-ai/fullsend-code@sha256:1f5b5d40a6ee3a5a9e51ff6d1e602c9ff71571aa5f6f14913cc53153348caff9
policy: policies/base.yaml
providers:
  - vertex-ai
  - package-registries
  - gitleaks
  - openai

role: coder
slug: fullsend-ai-coder

# CEL dispatch trigger (docs/guides/user/cel-triggers-reference.md in
# fullsend). Matches the event selection of the fix routing in fullsend's
# reusable-dispatch.yml, on GitHub and GitLab only (fix has no Jira path):
# a /fs-fix comment from a human on a PR/MR, or a changes-requested review
# submitted by a review bot. Fix pushes commits, so both paths require a
# same-repo change proposal; a missing state.change_proposal (failed PR
# lookup) does not match. The review path also honors the fullsend-no-fix
# opt-out label and runs only on a bot-authored PR or one labeled
# fullsend-fix. Dispatch authorizes bot reviews without a role threshold
# and this expression only checks the -review[bot] login suffix (which
# covers <org>-review[bot], fullsend-ai-review[bot] and
# <app-set>-review[bot]) plus actor.kind == "bot". That suffix is a coarse
# filter, not a trust check: any GitHub App whose login ends in
# -review[bot] passes it. The exact per-org review bot identity and the
# write permission of a human PR author cannot be expressed here and must
# stay with the dispatch workflow; do not rely on this expression alone to
# authenticate the reviewer. A GitHub PR comment arrives as a work_item with
# entity.linked_change_proposal set, a GitLab MR note as a change_proposal.
# harness/triggertest/trigger_test.go evaluates this against the
# NormalizedEvent fixtures.
trigger: >
  event.source.system in ["github", "gitlab"]
    && has(event.state.change_proposal)
    && !event.state.change_proposal.is_fork
    && ((event.transition.kind == "comment_added"
        && has(event.transition.comment.command)
        && event.transition.comment.command == "/fs-fix"
        && event.actor.kind == "human"
        && (event.entity.kind == "change_proposal"
            || has(event.entity.linked_change_proposal)))
      || (event.entity.kind == "change_proposal"
        && event.transition.kind == "review_submitted"
        && event.transition.review.state == "changes_requested"
        && event.actor.kind == "bot"
        && event.transition.review.reviewer_id.endsWith("-review[bot]")
        && !("fullsend-no-fix" in event.state.labels)
        && (event.state.change_proposal.author_id.endsWith("[bot]")
            || "fullsend-fix" in event.state.labels)))

pre_script: scripts/pre-fix.sh
post_script: scripts/post-fix.sh

validation_loop:
  script: scripts/validate-code-output.sh
  preflight_check: 'python3 -c "import jsonschema"'
  schema: schemas/fix-result.schema.json
  max_iterations: 2
  feedback_mode: append

host_files:
  - src: env/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: env/ssl-cainfo.env
    dest: /sandbox/workspace/.env.d/ssl-cainfo.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
    optional: true
  - src: ${REVIEW_BODY_FILE}
    dest: /sandbox/workspace/review-body.txt
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /sandbox/workspace/.gcp-oidc-token
    optional: true

skills:
  - skills/fix-review
  - skills/fix-history-rewrite
  - skills/fix-ci-inspection
  - skills/fix-verification
  - skills/fix-result-contract

env:
  runner:
    TARGET_BRANCH: "${TARGET_BRANCH}"
    TARGET_REPO_DIR: "${TARGET_REPO_DIR}"
    TRIGGER_SOURCE: "${TRIGGER_SOURCE}"
    HUMAN_INSTRUCTION: "${HUMAN_INSTRUCTION}"
    FIX_ITERATION: "${FIX_ITERATION}"
    REVIEW_BODY_FILE: "${REVIEW_BODY_FILE}"
    PRE_AGENT_HEAD: "${PRE_AGENT_HEAD}"
    PUSH_TOKEN: "${PUSH_TOKEN}"
    PUSH_TOKEN_SOURCE: "${PUSH_TOKEN_SOURCE}"
    REPO_FULL_NAME: "${REPO_FULL_NAME}"
    # Conservative default: merge the target into the PR/MR branch when the
    # forge reports a real conflict. Override via base: composition.
    FIX_CONFLICT_UPDATE_STRATEGY: "merge"
  sandbox:
    MAX_RETRIES: "1"
    TIMEOUT_SECONDS: "1500"
    STRATEGY_ESCALATION_THRESHOLD: "3"
    ITERATION_CAP: "5"
    ITERATION_CAP_HUMAN: "10"
    FIX_CONFLICT_UPDATE_STRATEGY: "merge"
    GOPATH: "/sandbox/go"
    GOMODCACHE: "/sandbox/go/pkg/mod"
    REPO_FULL_NAME: "${REPO_FULL_NAME}"
    TRIGGER_SOURCE: "${TRIGGER_SOURCE}"
    HUMAN_INSTRUCTION: "${HUMAN_INSTRUCTION}"
    FIX_ITERATION: "${FIX_ITERATION}"
    GIT_AUTHOR_NAME: "fullsend-fix"
    GIT_AUTHOR_EMAIL: "${GIT_BOT_EMAIL}"
    GIT_COMMITTER_NAME: "fullsend-fix"
    GIT_COMMITTER_EMAIL: "${GIT_BOT_EMAIL}"

timeout_minutes: 25

forge:
  github:
    providers:
      - providers/github-code.yaml
      - github-artifacts
    openshell:
      profiles:
        - profiles/fullsend-github-code.yaml
    skills:
      - skills/github-forge
      - skills/fix-review/github
    host_files:
      - src: env/github/fix.env
        dest: /sandbox/workspace/.env.d/forge-fix.env
        expand: true
    env:
      runner:
        PR_NUMBER: "${PR_NUMBER}"
        FULLSEND_FORGE: github
        # "true" publishes the branch through the Git Data API so GitHub
        # signs the commits (docs/code.md "Signed commits"); anything else
        # is a plain git push. Override per repo via base: composition.
        GITHUB_SIGNED_COMMITS: "false"
      sandbox:
        PR_NUMBER: "${PR_NUMBER}"
        FULLSEND_FORGE: github
  gitlab:
    providers:
      - providers/gitlab-code.yaml
    openshell:
      profiles:
        - profiles/fullsend-gitlab-code.yaml
    skills:
      - skills/gitlab-forge
      - skills/fix-review/gitlab
    host_files:
      - src: env/gitlab/fix.env
        dest: /sandbox/workspace/.env.d/forge-fix.env
        expand: true
    env:
      runner:
        PR_NUMBER: "${MR_NUMBER}"
        PR_URL: "${GITLAB_MR_URL}"
        GITLAB_TOKEN: "${GITLAB_TOKEN}"
        FULLSEND_FORGE: gitlab
      sandbox:
        PR_NUMBER: "${MR_NUMBER}"
        PR_URL: "${GITLAB_MR_URL}"
        FULLSEND_FORGE: gitlab
