# Expected outcome after the code agent + post-script run.
# Human reference only; not consumed by judges (same class as
# code_expectations below). Distinct from the live issue `state` key that
# capture-fixture.sh writes into fixture-state.json.
state: open

# Selected as the code agent's release-tier smoke case (eval/run-functional.sh
# EVAL_TIER=release) — the only case for this agent.
release: true

# End-to-end success: post-script opened a PR that touches the buggy file.
expected_files:
  - calc.py

# Code agent budgets (sandbox work + retries). Report-only: the eval's
# max_turns/max_cost judges have no threshold. max_cost_usd is ~3x the
# Sonnet 5.5 cost of $0.23 (run 37125458624), rounded up to $0.25.
max_turns: 60
max_cost_usd: 0.75

# Human reference only; not consumed by judges (unlike triage/review quality).
code_expectations: |
  The repo has a one-line bug in calc.py: add() subtracts instead of adds.
  A successful run creates a PR via the post-script that fixes add() to
  return a + b. Primary signal is pr_created — this case is an end-to-end
  regression guard for the code pipeline when sandbox GitHub is read-only
  (agent must still read the issue/repo and leave commits for post-script).
