state: open

expected_files:
  - config/config.go
  - config/fields.go
  - config/config_test.go

labels:
  forbidden: []

# Code agent budgets (sandbox work + retries). A deliberate ceiling, not a
# prediction — this case has no observed run of its own yet, so the numbers
# are bounded by two reference points rather than measured, and should be
# re-derived from this case's first CI run.
# Lower bound: 001-fix-add (same harness, trivial fixture) observed up to
# 35 turns / $2.12 (CI run 30166455238). This is a harder, cross-file task,
# so expect it to sit above that.
# Upper bound: #5808 (same dead-config-removal pattern, ~50k-LOC codebase)
# ran 75–79 turns / $3.85–$4.02 in the Round 4 A/B benchmark (2026-08-02,
# guyoron1/fullsend; workflow runs 30729219887 / 30740388070). This fixture
# is ~200 LOC, so expect it to stay below that.
# 60 turns / $4.00 sits between the two, matching 001's ceiling for a task
# one step harder. See: guyoron1/fullsend/docs/ab-benchmark-round4/
max_turns: 60
max_cost_usd: 4.00

# Human reference only; not consumed by judges (unlike triage/review quality).
code_expectations: |
  The repo has a dead config field: Config.VerboseLogging is declared, defaulted,
  parsed, and tested, but never read by any consumer (runner/runner.go doesn't
  use it). A successful run creates a PR that removes VerboseLogging from: the
  struct definition (config.go), the Defaults() return value (config.go), the
  SetField() switch case (fields.go), and all test assertions (config_test.go).
  Tests must still pass after removal. This case tests cross-file dead-code
  removal — tracing symbol references across multiple files to determine what
  to change, not just fixing a single line. The raw YAML literal in TestLoad
  (verbose_logging: true) must also be removed — SetField rejects unknown keys,
  so leaving it breaks Load().
