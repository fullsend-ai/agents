name: code-eval
description: >
  Functional test of the fullsend code agent pipeline (pre → sandbox → post).
  Validates that the post-script opens a PR touching the expected files for
  a small issue — an end-to-end pipeline guard, not a full correctness
  check. Cases may declare removed_symbols in annotations.yaml, mapping each
  symbol to the files it must disappear from and the number of deletion
  lines required per file; the removed_symbols judge then checks those
  counts in the captured PR diff and fails if the symbol survives anywhere
  in it, while the fixture_checks judge builds and tests the checked-out PR
  head so a change that satisfies the diff but does not compile (a usage
  site commented out while its declaration stays) still fails. Cases with no removed_symbols get
  file-touch only — no diff inspection, no build/test gate
  (see annotations.yaml: "Primary signal is pr_created").
  Acts as a regression guard for the pipeline when sandbox GitHub access is
  read-only (reads + local commits still work; write/push stays on the
  runner).

skill: code

execution:
  mode: case
  # Harness hard-kill for the whole run-fullsend.sh invocation (git clone +
  # `fullsend run` + metrics copy). Deliberately NOT sized to the code
  # agent's real production budget — see EVAL_TIMEOUT below for why that
  # budget (up to ~4200s across validation_loop's 2 iterations) cannot fit
  # inside this CI job's 45-minute cap
  # (.github/workflows/functional-tests.yml) alongside before_each (120s),
  # after_each (180s), and the job's own setup overhead (checkout, python/uv,
  # harness install, fullsend download, OpenShell + podman install). Measured
  # setup from run 33968109425: job start to "Run functional tests" is ~96s
  # total (podman install+configure+start is ~13s of it, not the ~190s an
  # earlier revision of this comment assumed).
  #
  # Sized for the JOB, not one case: this value is applied per case, and
  # parallelism: 1 runs the suite's cases back to back inside one matrix
  # leg capped at timeout-minutes: 45 (2700s). Derived for THREE cases,
  # because a third is already in flight (#1058 adds
  # 002-needs-input-uninterpretable to this same leg) and whichever of the
  # two PRs merges second would otherwise land a budget that no longer
  # holds: 3 x (120 + 500 + 180 + 30) = 2490s, leaving 210s for job setup
  # — a deliberate margin over the ~96s measured above, not an exact fit:
  # the setup steps (checkout, python/uv, harness install, fullsend
  # download, podman) vary, so the allowance must absorb a bad day without
  # handing the whole leg to the GitHub Actions hard timeout, which
  # produces no artifacts for any case. Two cases at this value are 1660s,
  # so merging before #1058 is safe too. The setup margin is what fixes the
  # ceiling, not the case count: 500 is the largest per-case value that
  # still leaves that margin for three cases (T <= (2700 - 150)/3 - 330 =
  # ~520), and a fourth case does not fit at any useful per-case value —
  # those cases would need their own matrix legs. 003 still has no observed
  # CI runtime; size from its first real run if it needs more than 500.
  timeout: 500
  parallelism: 1
  # Advisory only — the opaque-CLI-runner contract does not enforce this for
  # our runner type; a runaway run still spends what it spends and only
  # fails max_cost afterward. Set to match annotations.yaml's max_cost_usd
  # so the harness's own reporting agrees with the judge threshold.
  max_budget_usd: 4.00
  env:
    EVAL_ORG: $EVAL_ORG
    GH_TOKEN: $GH_TOKEN
    FULLSEND_DIR: $FULLSEND_DIR
    GOOGLE_APPLICATION_CREDENTIALS: $GOOGLE_APPLICATION_CREDENTIALS
    ANTHROPIC_VERTEX_PROJECT_ID: $ANTHROPIC_VERTEX_PROJECT_ID
    GOOGLE_CLOUD_PROJECT: $GOOGLE_CLOUD_PROJECT
    CLOUD_ML_REGION: $CLOUD_ML_REGION
    # Per-run runtime/model/effort for A/B comparisons (run-functional.sh
    # exports them; empty = use the workspace config / harness values).
    EVAL_RUNTIME: $EVAL_RUNTIME
    EVAL_MODEL: $EVAL_MODEL
    EVAL_EFFORT: $EVAL_EFFORT
    # Must live under execution.env — for runner: type: cli the harness's
    # CliRunner.from_config() builds the subprocess env from
    # config.execution.env only; runner.env has no effect (see
    # docs/opaque-cli-runner-contract.md). Putting EVAL_TIMEOUT under
    # runner.env silently fell back to run-fullsend.sh's default of 1800,
    # tying the outer harness SIGKILL to the inner `timeout` and inverting
    # the intended ordering.
    #
    # Deliberately far below the code agent's real production budget: each
    # validation_loop iteration is re-armed with its own fresh 2100s
    # (harness/code.yaml timeout_minutes: 35, mirrored as TIMEOUT_SECONDS
    # in harness/code.yaml env.sandbox for the agent's self-monitoring). internal/cli/run.go
    # computes that duration once before the iteration loop begins and
    # passes it into rt.Run() on each iteration; the fresh
    # context.WithTimeout(ctx, timeout) call actually happens in
    # internal/sandbox/sandbox.go's ExecStreamReader, invoked per-iteration
    # via internal/runtime/claude.go's Run method. harness/code.yaml allows
    # up to 2 iterations (validation_loop.max_iterations: 2) — worst case
    # ~4200s of agent time, on top of sandbox creation/image pull/
    # pre_script/post_script, none of which timeout_minutes bounds. None of
    # that fits inside this CI job's 45-minute cap with any safety margin,
    # so this eval does not attempt to reproduce the full production
    # timeout envelope; the window is derived from the job budget instead
    # (see execution.timeout above).
    #
    # Every case in this suite shares this window, run back to back
    # (parallelism: 1) inside one 45-minute matrix leg: today 001-fix-add
    # (a 2-line arithmetic bug) and 003-dead-config-field (a cross-file
    # dead-config removal with a larger 60-turn / $4.00 budget), with
    # #1058's 002-needs-input-uninterpretable in flight — three is what
    # execution.timeout above is derived for.
    # 420s here, 80s under execution.timeout (500) so this inner `timeout`
    # fires first and fullsend still writes a partial metrics.json before
    # returning (see writeMetricsJSON in run.go's error path), giving an
    # inconclusive but readable "metrics.json not found"-adjacent judge
    # failure rather than a harness SIGKILL. The 500s outer value is what
    # makes the job budget add up with real setup margin — see
    # execution.timeout above — so a hang in one case still leaves the
    # others their full window and their artifacts; at the old 1700/1800 a
    # first-case hang left the rest to the GitHub Actions job timeout,
    # which produces no artifacts. 001 is NOT sub-minute: it observed 44
    # turns / 236.8s (run 33968109425) and 37 turns / 195.8s (run
    # 34268404969), so 420s clears its measured max by ~183s (well over the
    # ~41s run-to-run swing between those two). 003 has no observed CI
    # runtime yet; if its first real run needs more than 420s, the code
    # cases need their own matrix legs rather than a larger share of this
    # one.
    # Separately, pr_created can also fail when the agent finishes
    # in-budget but never emits a schema-valid code-result.json —
    # validation_loop then skips post_script (ADR 0022), so no PR is
    # created despite a clean timeout path.
    EVAL_TIMEOUT: "420"

hooks:
  before_each:
    - command: "setup-fixture.sh"
      timeout: 120
      description: "Create ephemeral repo and issue fixture"

  after_each:
    - command: "capture-fixture.sh"
      # 180 rather than the sibling suites' 60: removed_symbols cases also
      # shallow-clone the PR head (up to 6 attempts, ~15s backoff) and run
      # go build + go test on it, each under its own `timeout 45` plus a
      # 5s --kill-after grace (see run_go_checks), on top of the diff-fetch
      # readiness poll (~16s) and the retried gh reads (~12s): ~143s worst
      # case, with slack for the clone/build themselves. A test that forks
      # a detached child can still outlive both, which is the residual
      # run_go_checks documents. The script writes fixture-state.json
      # before this expensive stage, so even an overrun here costs the
      # fixture_checks verdict, not every judge's input. Counted in
      # execution.timeout's job-budget arithmetic above.
      timeout: 180
      description: "Capture issue + PR state for judges"
    - command: "teardown-fixture.sh"
      timeout: 30
      on_failure: continue
      description: "Delete ephemeral repo"

runner:
  type: cli
  command:
    - "run-fullsend.sh"
    - "{agent}"
    - "{workspace}"
    - "{output_dir}"
# Unused for this CLI-runner type: runner.command has no {model} placeholder.
# The real model is harness/code.yaml's `model:` unless EVAL_MODEL is set,
# which run-fullsend.sh passes to `fullsend run --model` (see run-functional.sh).
# Declared here for harness reporting / parity with sibling evals only —
# same "advisory / not enforced" class of limitation as max_budget_usd above.
models:
  skill: claude-opus-4-6
  judge: claude-opus-4-6

dataset:
  path: cases
  schema: |
    Each case directory contains:
    - input.yaml: Issue fixture (title/body) against a small repo.
    - annotations.yaml: Expected PR outcome and budgets.
    - repo/: Directory (or symlink) with the git repo contents the agent sees.

outputs:
  - path: output
    schema: |
      fixture-state.json: Captured GitHub issue state plus any PRs opened
      by the code post-script. Contains: state, labels, comments, pull_requests.

# ---------------------------------------------------------------------------
# Judges
# ---------------------------------------------------------------------------
judges:
  - name: pr_created
    description: >
      Post-script must open at least one pull request (end-to-end success).
      Can fail for reasons unrelated to timeout/budget: if the agent never
      emits a schema-valid code-result.json, validation_loop skips
      post_script (ADR 0022) and no PR is created.
    check: |
      import json
      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found — capture-fixture.sh did not run or failed"
      state = json.loads(raw)
      prs = state.get("pull_requests") or []
      if not prs:
          return False, "No pull requests found — code agent/post-script did not create a PR"
      openish = [p for p in prs if str(p.get("state", "")).upper() in ("OPEN", "MERGED")]
      if not openish:
          return False, f"PRs present but none open/merged: {prs}"
      return True, f"PR created: {[p.get('url') for p in openish]}"

  - name: expected_files
    description: An open/merged PR must touch files listed in annotations.expected_files (if any)
    check: |
      import json
      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found — capture-fixture.sh did not run or failed"
      state = json.loads(raw)
      expected = outputs.get("annotations", {}).get("expected_files") or []
      if not expected:
          return True, "No expected_files declared"
      # Filter to OPEN/MERGED like pr_created — a closed/superseded PR's
      # files shouldn't count toward "the fix landed" any more than it
      # counts as PR creation succeeding.
      prs = [p for p in (state.get("pull_requests") or [])
             if str(p.get("state", "")).upper() in ("OPEN", "MERGED")]
      if any(p.get("files_fetch_failed") for p in prs):
          failed = [p.get("number") for p in prs if p.get("files_fetch_failed")]
          return False, f"Could not fetch changed files for PR(s): {failed}"
      changed = set()
      for pr in prs:
          for path in pr.get("files") or []:
              changed.add(path)
      missing = [p for p in expected if p not in changed]
      if missing:
          return False, f"Expected files missing from PRs: {missing} (changed: {sorted(changed)})"
      return True, f"All expected files present: {expected}"

  - name: removed_symbols
    description: >
      Content-level check for removal cases. annotations.removed_symbols maps
      each symbol to the files it must disappear from and, per file, the
      number of deletion lines that must name it in the captured PR diff
      (output/pr-<num>.diff, written by capture-fixture.sh) — one per
      original site, since every removed or edited line shows up as a
      deletion line. Deleted comment lines do not count toward it, mirroring
      the survivor scan's comment exemption, so a dropped doc comment cannot
      stand in for a real site. A count rather than a bare file list because one
      deletion line per file is satisfied by the struct field alone while a
      second site 11 lines away sits outside every hunk, neither deleted nor
      visible as a survivor. Entries are validated up front (a null, empty,
      list or scalar value fails the case rather than silently dropping the
      requirement). The judge also fails if the symbol survives in any added
      or context line. Passes trivially when a case declares no
      removed_symbols. Matching is word-boundary aware, so a renamed
      identifier that merely contains the symbol is not a survivor. The
      survivor scan covers every non-documentation file in the diff (not
      only the declared ones, so a new use added in runner.go still fails);
      documentation files (*.md, *.rst, *.txt, *.adoc, and files under a
      docs/ directory whose extension is not a known source type) are exempt
      wholesale so a README or changelog note may mention the symbol, while
      pkg/docs/gen.go is still source. Inside source files only pre-existing
      (context) line comments are exempt, keyed by extension (// for .go, #
      for .py/.sh/.yaml/...): a doc comment a fix leaves alone is fine, but
      an added comment naming the symbol is a survivor, because that is what
      a site commented out in place looks like — and when every site goes
      that way together the tree still builds and every silenced assertion
      still "passes", so fixture_checks alone cannot tell it from a real
      removal. The cost is that a new `// VerboseLogging removed` note in a
      touched source file fails too; put it in a doc file, which stays
      exempt. Unknown extensions get no comment exemption, and a
      Go block-comment continuation (" * text") is not recognised either — a
      bare "*" prefix is a pointer deref — so both fail closed. Hunk ranges
      from the @@ header are honoured, so content whose own text begins with
      "--" or "++" (a deleted SQL comment, an added "++ " line) is never
      mistaken for a file header. Whole-file deletions (+++ /dev/null) are
      attributed to the deleted path so their lines are counted against the
      right file, but deleting a declared file outright is itself a failure:
      every "-" line of that file would otherwise satisfy its count, and a
      deleted file contributes no added or context line for the survivor scan
      to object to. Declaring a file here asserts the symbol must leave it,
      not that the file may go — a case where deleting the file IS the fix
      should leave it out of removed_symbols and rely on expected_files.
      Diff-scoped: a symbol surviving in a file the PR never
      touched is invisible here (naming the file makes its absence a failure
      instead). A site commented out in place is caught here as an added
      comment line, but a usage site commented out while its declaration
      is left behind is one real deletion line plus a survivor this scan
      does see — and a fix that merely stops compiling in some other way
      (a dangling reference outside every hunk) is not visible in the
      diff at all, which is why the fixture_checks judge below builds and
      tests the actual PR head for these cases. Reads
      state["pull_requests"], which only capture-fixture.sh's issue-fixture
      branch writes — reusing this judge in a pull_request-type suite needs
      that branch to emit an equivalent diff artifact first.
    check: |
      import json
      import re
      symbols = outputs.get("annotations", {}).get("removed_symbols") or {}
      if not symbols:
          return True, "No removed_symbols declared"
      if not isinstance(symbols, dict):
          return False, (
              "removed_symbols must map each symbol to {file: deletion_count}, "
              f"got {type(symbols).__name__}"
          )
      # Validate every entry before reading the diff: a null/empty/list
      # value would otherwise iterate nothing and silently degrade to a
      # survivor-only check, which is the gap the per-file schema closes.
      for sym, sites in symbols.items():
          if not isinstance(sites, dict) or not sites or not all(
              isinstance(f, str) and f and isinstance(n, int)
              and not isinstance(n, bool) and n >= 1
              for f, n in sites.items()
          ):
              return False, (
                  f"{sym}: removed_symbols entry must map each file to the number "
                  "of deletion lines required (>= 1), "
                  f"got {type(sites).__name__}"
              )
      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found — capture-fixture.sh did not run or failed"
      state = json.loads(raw)
      prs = [p for p in (state.get("pull_requests") or [])
             if str(p.get("state", "")).upper() in ("OPEN", "MERGED")]
      if not prs:
          return False, "No open/merged PR to inspect"
      failed = [p.get("number") for p in prs if p.get("diff_fetch_failed")]
      if failed:
          return False, f"Could not fetch diff for PR(s): {failed}"
      # Bucket diff lines by the file they belong to. Inside a hunk every
      # line is content until the "@@ -a,b +c,d @@" counts are spent, so a
      # content line whose text starts with "--"/"++" (which serialises as
      # "--- "/"+++ ") cannot be taken for a header. Outside a hunk only
      # headers and metadata appear (diff/index, rename from|to, old|new
      # mode, similarity index, Binary files ...), none of which counts as
      # content. A file is identified by its "+++ b/" path, or by its
      # "--- a/" path when the "+++" side is /dev/null (whole-file deletion:
      # every line is a deletion line and must count toward that path).
      # "diff --git" resets the identity so a header-less block (mode-only
      # change) cannot inherit the previous file's. Those deleted paths are
      # also remembered: a declared file deleted wholesale is a failure, not
      # a way to satisfy its deletion count (see the description).
      HUNK = re.compile(r"@@ -\d+(?:,(\d+))? \+\d+(?:,(\d+))? @@")
      per_file = {}
      deleted_files = set()
      current = old_path = None
      old_left = new_left = 0
      for pr in prs:
          chunk = outputs["files"].get(f"output/pr-{pr.get('number')}.diff")
          if chunk is None:
              return False, f"output/pr-{pr.get('number')}.diff not captured"
          for line in chunk.splitlines():
              if old_left > 0 or new_left > 0:
                  if line.startswith("\\"):  # "\ No newline at end of file"
                      continue
                  tag = line[:1] or " "
                  if tag == " ":
                      old_left -= 1
                      new_left -= 1
                  elif tag == "-":
                      old_left -= 1
                  elif tag == "+":
                      new_left -= 1
                  else:  # malformed hunk: stop trusting its counts
                      old_left = new_left = 0
                      continue
                  per_file.setdefault(current, []).append(line)
                  continue
              if line.startswith("diff --git "):
                  current = old_path = None
                  continue
              if line.startswith("--- "):
                  path = line[4:].strip().split("\t")[0]
                  old_path = None if path == "/dev/null" else re.sub(r"^a/", "", path)
                  continue
              if line.startswith("+++ "):
                  path = line[4:].strip().split("\t")[0]
                  if path == "/dev/null":
                      current = old_path
                      if current:
                          deleted_files.add(current)
                  else:
                      current = re.sub(r"^b/", "", path)
                  continue
              m = HUNK.match(line)
              if m:
                  old_left = int(m.group(1) or 1)
                  new_left = int(m.group(2) or 1)

      def mentions(sym, line):
          # Word-boundary: VerboseLoggingEnabled must not match VerboseLogging.
          return re.search(r"\b" + re.escape(sym) + r"\b", line) is not None

      def ext_of(path):
          name = (path or "").rsplit("/", 1)[-1]
          return "." + name.rsplit(".", 1)[-1].lower() if "." in name else ""

      # Line-comment prefixes by extension. A bare "*" is deliberately NOT a
      # marker: in Go it is a pointer deref (`*VerboseLogging = true`), so a
      # block-comment continuation line is indistinguishable by prefix and
      # fails closed. Unknown extensions get no exemption at all.
      COMMENT_PREFIXES = {
          ".go": ("//",), ".js": ("//",), ".ts": ("//",), ".java": ("//",),
          ".c": ("//",), ".h": ("//",), ".rs": ("//",),
          ".py": ("#",), ".sh": ("#",), ".bash": ("#",), ".yaml": ("#",),
          ".yml": ("#",), ".toml": ("#",), ".mk": ("#",), ".rb": ("#",),
      }
      def is_comment(path, line):
          prefixes = COMMENT_PREFIXES.get(ext_of(path), ())
          return bool(prefixes) and line[1:].strip().startswith(prefixes)

      # Documentation is exempt from the survivor scan wholesale: prose and
      # markdown list markers (-, >, |, ...) have no reliable comment prefix,
      # and a note explaining the removal is a feature, not a survivor. A
      # known source extension is never documentation, wherever it lives
      # (pkg/docs/gen.go is Go); "docs" must be a real directory segment.
      DOC_SUFFIXES = (".md", ".markdown", ".rst", ".txt", ".adoc")
      def is_doc(path):
          p = (path or "").lower()
          if ext_of(p) in COMMENT_PREFIXES:
              return False
          return p.endswith(DOC_SUFFIXES) or "docs" in p.split("/")[:-1]

      problems = []
      for sym, sites in sorted(symbols.items()):
          # Checked before the counts: a wholesale deletion supplies as many
          # "-" lines as the file has, so the count loop below would read it
          # as an over-satisfied requirement instead of a skipped edit.
          gone = sorted(f for f in sites if f in deleted_files)
          if gone:
              problems.append(
                  f"{sym}: declared file(s) deleted wholesale instead of edited: {gone}"
              )
              continue
          survivors = []
          for path, lines in per_file.items():
              if is_doc(path):
                  continue
              for line in lines:
                  if line.startswith("-") or not mentions(sym, line):
                      continue
                  # Only a context line gets the comment exemption: an
                  # added comment naming the symbol is a site commented
                  # out in place, which fixture_checks cannot catch when
                  # every site (declaration, consumers, assertions) goes
                  # the same way — the tree builds and the muted tests pass.
                  if is_comment(path, line) and not line.startswith("+"):
                      continue
                  survivors.append(path or "<unknown file>")
                  break
          if survivors:
              problems.append(f"{sym}: survives in {sorted(set(survivors))}")
              continue
          short = []
          for path, need in sorted(sites.items()):
              # Comment lines are excluded from the count exactly as the
              # survivor scan exempts them: a deleted doc comment must not
              # stand in for a real site (comment + struct field would
              # otherwise satisfy config.go: 2 with Defaults() untouched).
              got = sum(1 for l in per_file.get(path, [])
                        if l.startswith("-") and mentions(sym, l)
                        and not is_comment(path, l))
              if got < need:
                  short.append(f"{path} ({got}/{need} deletion lines)")
          if short:
              problems.append(f"{sym}: too few deletion lines in {short}")
      if problems:
          return False, "Symbols not fully removed: " + "; ".join(problems)
      return True, f"All declared symbols removed cleanly from their declared files: {sorted(symbols)}"

  - name: fixture_checks
    description: >
      Build/test gate for removed_symbols cases, closing the hole diff
      inspection cannot see: a diff can satisfy every deletion count and
      show no survivor while the PR head no longer compiles — a second site
      in the same file outside every hunk, or a reference in a file the PR
      never touched. (An in-place comment-out is the removed_symbols judge's
      job: the added comment line is a survivor there, since a comment-out
      of every site together still builds and passes tests.)
      capture-fixture.sh clones each PR head and runs `go build ./...` and
      `go test ./...`, recording exit codes under pull_requests[].checks;
      this judge requires both to be 0. Passes trivially when the case
      declares no removed_symbols, and fails closed when removed_symbols is
      present but not a mapping. A recorded skip passes with the reason in
      the message — recorded, not silent — except "no go.mod" for a case
      whose removed_symbols name .go files: there the missing go.mod is the
      PR's own doing (deleting it is never a fix) and skipping would hand
      the agent a free pass on the whole build/test gate, so it fails. A
      missing toolchain is an environment fact rather than agent behaviour
      and still passes as a recorded skip. Missing checks or a clone failure
      fail the case: evidence must exist, the same stance as
      diff_fetch_failed, since this runs at min_pass_rate 1.0.
    check: |
      import json
      symbols = outputs.get("annotations", {}).get("removed_symbols") or {}
      if not symbols:
          return True, "No removed_symbols declared"
      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found — capture-fixture.sh did not run or failed"
      state = json.loads(raw)
      prs = [p for p in (state.get("pull_requests") or [])
             if str(p.get("state", "")).upper() in ("OPEN", "MERGED")]
      if not prs:
          return False, "No open/merged PR to inspect"
      # A Go case cannot legitimately end with no go.mod on the PR head, so
      # that skip must not be the way past the gate the whole judge exists
      # to enforce. The shape check fails closed here in its own right
      # rather than leaning on removed_symbols to reject the annotation,
      # so this judge stays correct wherever it is reused.
      if not isinstance(symbols, dict):
          return False, "removed_symbols is malformed; see the removed_symbols judge for the schema"
      go_case = any(f.endswith(".go") for sites in symbols.values()
                    if isinstance(sites, dict) for f in sites)
      skips = []
      problems = []
      for p in prs:
          num = p.get("number")
          checks = p.get("checks")
          if not isinstance(checks, dict):
              problems.append(f"PR #{num}: no build/test checks captured")
          elif checks.get("clone_failed"):
              problems.append(f"PR #{num}: could not clone head for build/test")
          elif "skipped" in checks:
              if go_case and checks["skipped"] == "no go.mod":
                  problems.append(
                      f"PR #{num}: no go.mod on the PR head — the build/test gate "
                      "cannot be skipped by a case whose removed_symbols name .go files"
                  )
              else:
                  skips.append(f"PR #{num}: checks skipped ({checks['skipped']})")
          elif checks.get("build_exit") != 0 or checks.get("test_exit") != 0:
              problems.append(
                  f"PR #{num}: go build exit {checks.get('build_exit')}, "
                  f"go test exit {checks.get('test_exit')}"
              )
      if problems:
          return False, "; ".join(problems + skips)
      if skips:
          return True, "; ".join(skips)
      return True, "go build and go test pass on every PR head"

  # forbidden_labels / max_turns / max_cost below are shared verbatim with
  # eval/fix/eval.yaml and eval/review/eval.yaml — update all three if changing.
  - name: forbidden_labels
    description: Labels listed in annotations.yaml forbidden list must NOT be present
    check: |
      import json
      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found — capture-fixture.sh did not run or failed"
      state = json.loads(raw)
      actual = [l.lower() for l in state.get("labels", [])]
      forbidden = outputs.get("annotations", {}).get("labels", {}).get("forbidden", [])
      if not forbidden:
          return True, "No forbidden labels specified"
      present = [l for l in forbidden if l.lower() in actual]
      if present:
          return False, f"Forbidden labels present: {present} (actual: {actual})"
      return True, f"No forbidden labels found (checked: {forbidden})"

  - name: max_turns
    description: Agent must complete within the declared turn budget
    check: |
      import json
      raw = outputs["files"].get("output/metrics.json")
      if not raw:
          return False, "metrics.json not found"
      metrics = json.loads(raw)
      actual = metrics.get("num_turns")
      if actual is None:
          return False, "num_turns not present in metrics.json"
      limit = outputs.get("annotations", {}).get("max_turns")
      if limit is None:
          return False, "max_turns not declared in annotations.yaml"
      if int(actual) > int(limit):
          return False, f"Exceeded max_turns: {actual} > {limit}"
      return True, f"Turns OK: {actual} <= {limit}"

  - name: max_cost
    description: Agent must complete within the declared cost budget
    check: |
      import json
      raw = outputs["files"].get("output/metrics.json")
      if not raw:
          return False, "metrics.json not found"
      metrics = json.loads(raw)
      actual = metrics.get("total_cost_usd")
      if actual is None:
          return False, "total_cost_usd not present in metrics.json"
      limit = outputs.get("annotations", {}).get("max_cost_usd")
      if limit is None:
          return False, "max_cost_usd not declared in annotations.yaml"
      if float(actual) > float(limit):
          return False, f"Exceeded max_cost_usd: {actual} > {limit}"
      return True, f"Cost OK: {actual} <= {limit}"

thresholds:
  pr_created:
    min_pass_rate: 1.0
  expected_files:
    min_pass_rate: 1.0
  removed_symbols:
    min_pass_rate: 1.0
  fixture_checks:
    min_pass_rate: 1.0
  forbidden_labels:
    min_pass_rate: 1.0
  max_turns:
    min_pass_rate: 1.0
  max_cost:
    min_pass_rate: 1.0
