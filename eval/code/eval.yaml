name: code-eval
description: >
  Functional test of the fullsend code agent pipeline (pre → sandbox → post).
  Validates that the post-script opens a PR touching the expected files for
  a small issue — an end-to-end pipeline guard, not a full correctness
  check. Cases may declare removed_symbols in annotations.yaml, mapping each
  symbol to the files it must disappear from; the removed_symbols judge then
  requires a deletion line per declared file in the captured PR diff and
  fails if the symbol survives anywhere in it. Beyond that, no judge runs
  the fixture's tests against the PR, so a fix that compiles but misbehaves
  can still pass — and cases with no removed_symbols get file-touch only
  (see annotations.yaml: "Primary signal is pr_created").
  Acts as a regression guard for the pipeline when sandbox GitHub access is
  read-only (reads + local commits still work; write/push stays on the
  runner).

skill: code

execution:
  mode: case
  # Harness hard-kill for the whole run-fullsend.sh invocation (git clone +
  # `fullsend run` + metrics copy). Deliberately NOT sized to the code
  # agent's real production budget — see EVAL_TIMEOUT below for why that
  # budget (up to ~4200s across validation_loop's 2 iterations) cannot fit
  # inside this CI job's 45-minute cap
  # (.github/workflows/functional-tests.yml) alongside before_each (120s),
  # after_each (90s), and the job's own setup overhead (checkout, python/uv,
  # harness install, fullsend download, OpenShell + podman install — podman
  # alone routinely takes ~190s). 1800 matches eval/fix/eval.yaml rather
  # than deriving from harness/code.yaml, since no headroom choice derived
  # from the real budget fits regardless.
  timeout: 1800
  parallelism: 1
  # Advisory only — the opaque-CLI-runner contract does not enforce this for
  # our runner type; a runaway run still spends what it spends and only
  # fails max_cost afterward. Set to match annotations.yaml's max_cost_usd
  # so the harness's own reporting agrees with the judge threshold.
  max_budget_usd: 4.00
  env:
    EVAL_ORG: $EVAL_ORG
    GH_TOKEN: $GH_TOKEN
    FULLSEND_DIR: $FULLSEND_DIR
    GOOGLE_APPLICATION_CREDENTIALS: $GOOGLE_APPLICATION_CREDENTIALS
    ANTHROPIC_VERTEX_PROJECT_ID: $ANTHROPIC_VERTEX_PROJECT_ID
    GOOGLE_CLOUD_PROJECT: $GOOGLE_CLOUD_PROJECT
    CLOUD_ML_REGION: $CLOUD_ML_REGION
    # Must live under execution.env — for runner: type: cli the harness's
    # CliRunner.from_config() builds the subprocess env from
    # config.execution.env only; runner.env has no effect (see
    # docs/opaque-cli-runner-contract.md). Putting EVAL_TIMEOUT under
    # runner.env silently fell back to run-fullsend.sh's default of 1800,
    # tying the outer harness SIGKILL to the inner `timeout` and inverting
    # the intended ordering.
    #
    # Deliberately far below the code agent's real production budget: each
    # validation_loop iteration is re-armed with its own fresh 2100s
    # (harness/code.yaml timeout_minutes: 35, mirrored as TIMEOUT_SECONDS
    # in harness/code.yaml env.sandbox for the agent's self-monitoring). internal/cli/run.go
    # computes that duration once before the iteration loop begins and
    # passes it into rt.Run() on each iteration; the fresh
    # context.WithTimeout(ctx, timeout) call actually happens in
    # internal/sandbox/sandbox.go's ExecStreamReader, invoked per-iteration
    # via internal/runtime/claude.go's Run method. harness/code.yaml allows
    # up to 2 iterations (validation_loop.max_iterations: 2) — worst case
    # ~4200s of agent time, on top of sandbox creation/image pull/
    # pre_script/post_script, none of which timeout_minutes bounds. None of
    # that fits inside this CI job's 45-minute cap with any safety margin,
    # so this eval does not attempt to reproduce the full production
    # timeout envelope; matches eval/fix/eval.yaml's value instead (see
    # execution.timeout above).
    #
    # Two cases now share this window: 001-fix-add (a 2-line arithmetic bug
    # that completes in well under a minute) and 003-dead-config-field (a
    # cross-file dead-config removal with a larger 60-turn / $4.00 budget).
    # Neither is expected to approach 1700s in practice: these small fixtures
    # finish far under it. Note the 1700s outer backstop — not the larger
    # 2100s per-iteration agent budget — is the binding limit, so a genuine
    # hang is caught by 1700s first. 003 has no observed CI runtime yet, so
    # treat its headroom as an open risk to revisit once a real run exists.
    # If a genuine hang did occur: a single-iteration hang gets caught here and
    # fullsend still writes a partial metrics.json before returning (see
    # writeMetricsJSON in run.go's error path), giving an inconclusive but
    # readable "metrics.json not found"-adjacent judge failure; a
    # multi-iteration hang, or CI overhead pushing total time past 45min,
    # gets a hard GitHub Actions job timeout with no artifacts at all. This
    # ladder is a best-effort local-run affordance, not a guaranteed
    # graceful-degradation path in CI. Separately, pr_created can also fail
    # when the agent finishes in-budget but never emits a schema-valid
    # code-result.json — validation_loop then skips post_script (ADR 0022),
    # so no PR is created despite a clean timeout path.
    EVAL_TIMEOUT: "1700"

hooks:
  before_each:
    - command: "setup-fixture.sh"
      timeout: 120
      description: "Create ephemeral repo and issue fixture"

  after_each:
    - command: "capture-fixture.sh"
      timeout: 60
      description: "Capture issue + PR state for judges"
    - command: "teardown-fixture.sh"
      timeout: 30
      on_failure: continue
      description: "Delete ephemeral repo"

runner:
  type: cli
  command:
    - "run-fullsend.sh"
    - "{agent}"
    - "{workspace}"
    - "{output_dir}"
# Unused for this CLI-runner type: runner.command has no {model} placeholder
# and run-fullsend.sh never passes --model (or equivalent) to `fullsend run`.
# The real model is controlled solely by harness/code.yaml's `model:` field.
# Declared here for harness reporting / parity with sibling evals only —
# same "advisory / not enforced" class of limitation as max_budget_usd above.
models:
  skill: claude-opus-4-6
  judge: claude-opus-4-6

dataset:
  path: cases
  schema: |
    Each case directory contains:
    - input.yaml: Issue fixture (title/body) against a small repo.
    - annotations.yaml: Expected PR outcome and budgets.
    - repo/: Directory (or symlink) with the git repo contents the agent sees.

outputs:
  - path: output
    schema: |
      fixture-state.json: Captured GitHub issue state plus any PRs opened
      by the code post-script. Contains: state, labels, comments, pull_requests.

# ---------------------------------------------------------------------------
# Judges
# ---------------------------------------------------------------------------
judges:
  - name: pr_created
    description: >
      Post-script must open at least one pull request (end-to-end success).
      Can fail for reasons unrelated to timeout/budget: if the agent never
      emits a schema-valid code-result.json, validation_loop skips
      post_script (ADR 0022) and no PR is created.
    check: |
      import json
      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found — capture-fixture.sh did not run or failed"
      state = json.loads(raw)
      prs = state.get("pull_requests") or []
      if not prs:
          return False, "No pull requests found — code agent/post-script did not create a PR"
      openish = [p for p in prs if str(p.get("state", "")).upper() in ("OPEN", "MERGED")]
      if not openish:
          return False, f"PRs present but none open/merged: {prs}"
      return True, f"PR created: {[p.get('url') for p in openish]}"

  - name: expected_files
    description: An open/merged PR must touch files listed in annotations.expected_files (if any)
    check: |
      import json
      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found — capture-fixture.sh did not run or failed"
      state = json.loads(raw)
      expected = outputs.get("annotations", {}).get("expected_files") or []
      if not expected:
          return True, "No expected_files declared"
      # Filter to OPEN/MERGED like pr_created — a closed/superseded PR's
      # files shouldn't count toward "the fix landed" any more than it
      # counts as PR creation succeeding.
      prs = [p for p in (state.get("pull_requests") or [])
             if str(p.get("state", "")).upper() in ("OPEN", "MERGED")]
      if any(p.get("files_fetch_failed") for p in prs):
          failed = [p.get("number") for p in prs if p.get("files_fetch_failed")]
          return False, f"Could not fetch changed files for PR(s): {failed}"
      changed = set()
      for pr in prs:
          for path in pr.get("files") or []:
              changed.add(path)
      missing = [p for p in expected if p not in changed]
      if missing:
          return False, f"Expected files missing from PRs: {missing} (changed: {sorted(changed)})"
      return True, f"All expected files present: {expected}"

  - name: removed_symbols
    description: >
      Content-level check for removal cases. annotations.removed_symbols maps
      each symbol to the files it must disappear from; the judge requires a
      deletion line for that symbol in every listed file of the captured PR
      diff (output/pr-<num>.diff, written by capture-fixture.sh), and fails if
      the symbol survives in any added or context line. Per-file because a
      global "deleted somewhere" count is satisfied by the first file alone,
      which would let a partial removal pass. Passes trivially when a case
      declares no removed_symbols. Matching is word-boundary aware, so a
      renamed identifier that merely contains the symbol is not a survivor.
      The survivor scan covers every non-documentation file in the diff (not
      only the declared ones, so a new use added in runner.go still fails);
      documentation files (*.md, *.rst, *.txt, *.adoc, docs/**) are exempt
      wholesale so a README or changelog note may mention the symbol, and
      inside source files only line comments are exempt, keyed by extension
      (// for .go, # for .py/.sh/.yaml/...). Unknown extensions get no
      comment exemption, and a Go block-comment continuation (" * text") is
      not recognised either — a bare "*" prefix is a pointer deref — so both
      fail closed. Whole-file deletions (+++ /dev/null) are attributed to the
      deleted path, so deleting a now-empty file satisfies its requirement.
      Diff-scoped: a symbol surviving in a file the PR never touched is
      invisible here (naming the file makes its absence a failure instead),
      and no judge runs the fixture's tests. Reads state["pull_requests"],
      which only capture-fixture.sh's issue-fixture branch writes — reusing
      this judge in a pull_request-type suite needs that branch to emit an
      equivalent diff artifact first.
    check: |
      import json
      import re
      symbols = outputs.get("annotations", {}).get("removed_symbols") or {}
      if not symbols:
          return True, "No removed_symbols declared"
      if not isinstance(symbols, dict):
          return False, (
              "removed_symbols must map each symbol to the files it must be "
              f"deleted from, got {type(symbols).__name__}"
          )
      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found — capture-fixture.sh did not run or failed"
      state = json.loads(raw)
      prs = [p for p in (state.get("pull_requests") or [])
             if str(p.get("state", "")).upper() in ("OPEN", "MERGED")]
      if not prs:
          return False, "No open/merged PR to inspect"
      failed = [p.get("number") for p in prs if p.get("diff_fetch_failed")]
      if failed:
          return False, f"Could not fetch diff for PR(s): {failed}"
      # Bucket diff lines by the file they belong to. Only ' ', '+' and '-'
      # start content lines; everything else is metadata (diff/index/@@,
      # rename from|to, old|new mode, similarity index, Binary files ...),
      # which must never count as a survivor. The "+++ b/<path>" header is
      # itself a "+" line, so headers are consumed before that test. A file
      # is identified by its "+++ b/" path, or by its "--- a/" path when the
      # "+++" side is /dev/null (whole-file deletion: every line is a
      # deletion line and must count toward that path). "diff --git" resets
      # the identity so a header-less block (mode-only change) cannot
      # inherit the previous file's.
      per_file = {}
      current = old_path = None
      for pr in prs:
          chunk = outputs["files"].get(f"output/pr-{pr.get('number')}.diff")
          if chunk is None:
              return False, f"output/pr-{pr.get('number')}.diff not captured"
          for line in chunk.splitlines():
              if line.startswith("diff --git "):
                  current = old_path = None
                  continue
              if line.startswith("--- "):
                  path = line[4:].strip().split("\t")[0]
                  old_path = None if path == "/dev/null" else re.sub(r"^a/", "", path)
                  continue
              if line.startswith("+++ "):
                  path = line[4:].strip().split("\t")[0]
                  current = old_path if path == "/dev/null" else re.sub(r"^b/", "", path)
                  continue
              if not line or line[0] not in " +-":
                  continue
              per_file.setdefault(current, []).append(line)

      def mentions(sym, line):
          # Word-boundary: VerboseLoggingEnabled must not match VerboseLogging.
          return re.search(r"\b" + re.escape(sym) + r"\b", line) is not None

      # Documentation is exempt from the survivor scan wholesale: prose and
      # markdown list markers (-, >, |, ...) have no reliable comment prefix,
      # and a note explaining the removal is a feature, not a survivor.
      DOC_SUFFIXES = (".md", ".markdown", ".rst", ".txt", ".adoc")
      def is_doc(path):
          p = (path or "").lower()
          return p.endswith(DOC_SUFFIXES) or p.startswith("docs/") or "/docs/" in p

      # Line-comment prefixes by extension. A bare "*" is deliberately NOT a
      # marker: in Go it is a pointer deref (`*VerboseLogging = true`), so a
      # block-comment continuation line is indistinguishable by prefix and
      # fails closed. Unknown extensions get no exemption at all.
      COMMENT_PREFIXES = {
          ".go": ("//",), ".js": ("//",), ".ts": ("//",), ".java": ("//",),
          ".c": ("//",), ".h": ("//",), ".rs": ("//",),
          ".py": ("#",), ".sh": ("#",), ".bash": ("#",), ".yaml": ("#",),
          ".yml": ("#",), ".toml": ("#",), ".mk": ("#",), ".rb": ("#",),
      }
      def is_comment(path, line):
          ext = "." + (path or "").rsplit(".", 1)[-1].lower() if "." in (path or "") else ""
          prefixes = COMMENT_PREFIXES.get(ext, ())
          return bool(prefixes) and line[1:].strip().startswith(prefixes)

      problems = []
      for sym, required_files in sorted(symbols.items()):
          if isinstance(required_files, str):
              required_files = [required_files]
          survivors = []
          for path, lines in per_file.items():
              if is_doc(path):
                  continue
              for line in lines:
                  if line.startswith("-") or not mentions(sym, line):
                      continue
                  if is_comment(path, line):
                      continue
                  survivors.append(path or "<unknown file>")
                  break
          if survivors:
              problems.append(f"{sym}: survives in {sorted(set(survivors))}")
              continue
          missing = [f for f in (required_files or [])
                     if not any(l.startswith("-") and mentions(sym, l)
                                for l in per_file.get(f, []))]
          if missing:
              problems.append(f"{sym}: no deletion line in {missing}")
      if problems:
          return False, "Symbols not fully removed: " + "; ".join(problems)
      return True, f"All declared symbols removed cleanly from their declared files: {sorted(symbols)}"

  # forbidden_labels / max_turns / max_cost below are shared verbatim with
  # eval/fix/eval.yaml and eval/review/eval.yaml — update all three if changing.
  - name: forbidden_labels
    description: Labels listed in annotations.yaml forbidden list must NOT be present
    check: |
      import json
      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found — capture-fixture.sh did not run or failed"
      state = json.loads(raw)
      actual = [l.lower() for l in state.get("labels", [])]
      forbidden = outputs.get("annotations", {}).get("labels", {}).get("forbidden", [])
      if not forbidden:
          return True, "No forbidden labels specified"
      present = [l for l in forbidden if l.lower() in actual]
      if present:
          return False, f"Forbidden labels present: {present} (actual: {actual})"
      return True, f"No forbidden labels found (checked: {forbidden})"

  - name: max_turns
    description: Agent must complete within the declared turn budget
    check: |
      import json
      raw = outputs["files"].get("output/metrics.json")
      if not raw:
          return False, "metrics.json not found"
      metrics = json.loads(raw)
      actual = metrics.get("num_turns")
      if actual is None:
          return False, "num_turns not present in metrics.json"
      limit = outputs.get("annotations", {}).get("max_turns")
      if limit is None:
          return False, "max_turns not declared in annotations.yaml"
      if int(actual) > int(limit):
          return False, f"Exceeded max_turns: {actual} > {limit}"
      return True, f"Turns OK: {actual} <= {limit}"

  - name: max_cost
    description: Agent must complete within the declared cost budget
    check: |
      import json
      raw = outputs["files"].get("output/metrics.json")
      if not raw:
          return False, "metrics.json not found"
      metrics = json.loads(raw)
      actual = metrics.get("total_cost_usd")
      if actual is None:
          return False, "total_cost_usd not present in metrics.json"
      limit = outputs.get("annotations", {}).get("max_cost_usd")
      if limit is None:
          return False, "max_cost_usd not declared in annotations.yaml"
      if float(actual) > float(limit):
          return False, f"Exceeded max_cost_usd: {actual} > {limit}"
      return True, f"Cost OK: {actual} <= {limit}"

thresholds:
  pr_created:
    min_pass_rate: 1.0
  expected_files:
    min_pass_rate: 1.0
  removed_symbols:
    min_pass_rate: 1.0
  forbidden_labels:
    min_pass_rate: 1.0
  max_turns:
    min_pass_rate: 1.0
  max_cost:
    min_pass_rate: 1.0
