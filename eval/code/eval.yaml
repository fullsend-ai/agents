name: code-eval
description: >
  Functional test of the fullsend code agent pipeline (pre → sandbox → post).
  Validates that the post-script opens a PR touching the expected files for
  a small issue — an end-to-end pipeline guard, not a correctness check.
  No judge inspects the PR's diff content or runs the fixture's tests
  against it (see annotations.yaml: "Primary signal is pr_created"), so a PR
  that opens but contains a cosmetic or outright wrong fix still passes.
  Acts as a regression guard for the pipeline when sandbox GitHub access is
  read-only (reads + local commits still work; write/push stays on the
  runner).

skill: code

execution:
  mode: case
  # Harness hard-kill for the whole run-fullsend.sh invocation (git clone +
  # `fullsend run` + metrics copy). Deliberately NOT sized to the code
  # agent's real production budget — see EVAL_TIMEOUT below for why that
  # budget (up to ~4200s across validation_loop's 2 iterations) cannot fit
  # inside this CI job's 45-minute cap
  # (.github/workflows/functional-tests.yml) alongside before_each (120s),
  # after_each (90s), and the job's own setup overhead (checkout, python/uv,
  # harness install, fullsend download, OpenShell + podman install — podman
  # alone routinely takes ~190s). 1800 matches eval/fix/eval.yaml rather
  # than deriving from harness/code.yaml, since no headroom choice derived
  # from the real budget fits regardless.
  timeout: 1800
  parallelism: 1
  # Advisory only — the opaque-CLI-runner contract does not enforce this for
  # our runner type; a runaway run still spends what it spends and only
  # fails max_cost afterward. Set to match annotations.yaml's max_cost_usd
  # so the harness's own reporting agrees with the judge threshold.
  max_budget_usd: 4.00
  env:
    EVAL_ORG: $EVAL_ORG
    GH_TOKEN: $GH_TOKEN
    FULLSEND_DIR: $FULLSEND_DIR
    GOOGLE_APPLICATION_CREDENTIALS: $GOOGLE_APPLICATION_CREDENTIALS
    ANTHROPIC_VERTEX_PROJECT_ID: $ANTHROPIC_VERTEX_PROJECT_ID
    GOOGLE_CLOUD_PROJECT: $GOOGLE_CLOUD_PROJECT
    CLOUD_ML_REGION: $CLOUD_ML_REGION

hooks:
  before_each:
    - command: "setup-fixture.sh"
      timeout: 120
      description: "Create ephemeral repo and issue fixture"

  after_each:
    - command: "capture-fixture.sh"
      timeout: 60
      description: "Capture issue + PR state for judges"
    - command: "teardown-fixture.sh"
      timeout: 30
      on_failure: continue
      description: "Delete ephemeral repo"

runner:
  type: cli
  command:
    - "run-fullsend.sh"
    - "{agent}"
    - "{workspace}"
    - "{output_dir}"
  env:
    FULLSEND_DIR: $FULLSEND_DIR
    GH_TOKEN: $GH_TOKEN
    # Deliberately far below the code agent's real production budget: each
    # validation_loop iteration is re-armed with its own fresh 2100s
    # (harness/code.yaml timeout_minutes: 35, mirrored as TIMEOUT_SECONDS in
    # env/code.env for the agent's own self-monitoring; internal/cli/run.go
    # re-derives the context.WithTimeout from h.TimeoutMinutes inside the
    # iteration loop), and harness/code.yaml allows up to 2 iterations
    # (validation_loop.max_iterations: 2) — worst case ~4200s of agent time,
    # on top of sandbox creation/image pull/pre_script/post_script, none of
    # which timeout_minutes bounds. None of that fits inside this CI job's
    # 45-minute cap with any safety margin, so this eval does not attempt to
    # reproduce the full production timeout envelope; matches
    # eval/fix/eval.yaml's value instead (see execution.timeout above).
    #
    # This fixture is a 2-line arithmetic bug and completes in well under a
    # minute in practice, so this number essentially never fires. If a
    # genuine hang did occur: a single-iteration hang gets caught here and
    # fullsend still writes a partial metrics.json before returning (see
    # writeMetricsJSON in run.go's error path), giving an inconclusive but
    # readable "metrics.json not found"-adjacent judge failure; a
    # multi-iteration hang, or CI overhead pushing total time past 45min,
    # gets a hard GitHub Actions job timeout with no artifacts at all. This
    # ladder is a best-effort local-run affordance, not a guaranteed
    # graceful-degradation path in CI.
    EVAL_TIMEOUT: "1700"
    GOOGLE_APPLICATION_CREDENTIALS: $GOOGLE_APPLICATION_CREDENTIALS
    ANTHROPIC_VERTEX_PROJECT_ID: $ANTHROPIC_VERTEX_PROJECT_ID
    GOOGLE_CLOUD_PROJECT: $GOOGLE_CLOUD_PROJECT
    CLOUD_ML_REGION: $CLOUD_ML_REGION

models:
  skill: claude-opus-4-6
  judge: claude-opus-4-6

dataset:
  path: cases
  schema: |
    Each case directory contains:
    - input.yaml: Issue fixture (title/body) against a small repo.
    - annotations.yaml: Expected PR outcome and budgets.
    - repo/: Directory (or symlink) with the git repo contents the agent sees.

outputs:
  - path: output
    schema: |
      fixture-state.json: Captured GitHub issue state plus any PRs opened
      by the code post-script. Contains: state, labels, comments, pull_requests.

# ---------------------------------------------------------------------------
# Judges
# ---------------------------------------------------------------------------
judges:
  - name: pr_created
    description: Post-script must open at least one pull request (end-to-end success)
    check: |
      import json
      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found — capture-fixture.sh did not run or failed"
      state = json.loads(raw)
      prs = state.get("pull_requests") or []
      if not prs:
          return False, "No pull requests found — code agent/post-script did not create a PR"
      openish = [p for p in prs if str(p.get("state", "")).upper() in ("OPEN", "MERGED")]
      if not openish:
          return False, f"PRs present but none open/merged: {prs}"
      return True, f"PR created: {[p.get('url') for p in openish]}"

  - name: expected_files
    description: An open/merged PR must touch files listed in annotations.expected_files (if any)
    check: |
      import json
      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found — capture-fixture.sh did not run or failed"
      state = json.loads(raw)
      expected = outputs.get("annotations", {}).get("expected_files") or []
      if not expected:
          return True, "No expected_files declared"
      # Filter to OPEN/MERGED like pr_created — a closed/superseded PR's
      # files shouldn't count toward "the fix landed" any more than it
      # counts as PR creation succeeding.
      prs = [p for p in (state.get("pull_requests") or [])
             if str(p.get("state", "")).upper() in ("OPEN", "MERGED")]
      if any(p.get("files_fetch_failed") for p in prs):
          failed = [p.get("number") for p in prs if p.get("files_fetch_failed")]
          return False, f"Could not fetch changed files for PR(s): {failed}"
      changed = set()
      for pr in prs:
          for path in pr.get("files") or []:
              changed.add(path)
      missing = [p for p in expected if p not in changed]
      if missing:
          return False, f"Expected files missing from PRs: {missing} (changed: {sorted(changed)})"
      return True, f"All expected files present: {expected}"

  - name: forbidden_labels
    description: Labels listed in annotations.yaml forbidden list must NOT be present
    check: |
      import json
      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found — capture-fixture.sh did not run or failed"
      state = json.loads(raw)
      actual = [l.lower() for l in state.get("labels", [])]
      forbidden = outputs.get("annotations", {}).get("labels", {}).get("forbidden", [])
      if not forbidden:
          return True, "No forbidden labels specified"
      present = [l for l in forbidden if l.lower() in actual]
      if present:
          return False, f"Forbidden labels present: {present} (actual: {actual})"
      return True, f"No forbidden labels found (checked: {forbidden})"

  - name: max_turns
    description: Agent must complete within the declared turn budget
    check: |
      import json
      raw = outputs["files"].get("output/metrics.json")
      if not raw:
          return False, "metrics.json not found"
      metrics = json.loads(raw)
      actual = metrics.get("num_turns")
      if actual is None:
          return False, "num_turns not present in metrics.json"
      limit = outputs.get("annotations", {}).get("max_turns")
      if limit is None:
          return False, "max_turns not declared in annotations.yaml"
      if int(actual) > int(limit):
          return False, f"Exceeded max_turns: {actual} > {limit}"
      return True, f"Turns OK: {actual} <= {limit}"

  - name: max_cost
    description: Agent must complete within the declared cost budget
    check: |
      import json
      raw = outputs["files"].get("output/metrics.json")
      if not raw:
          return False, "metrics.json not found"
      metrics = json.loads(raw)
      actual = metrics.get("total_cost_usd")
      if actual is None:
          return False, "total_cost_usd not present in metrics.json"
      limit = outputs.get("annotations", {}).get("max_cost_usd")
      if limit is None:
          return False, "max_cost_usd not declared in annotations.yaml"
      if float(actual) > float(limit):
          return False, f"Exceeded max_cost_usd: {actual} > {limit}"
      return True, f"Cost OK: {actual} <= {limit}"

thresholds:
  pr_created:
    min_pass_rate: 1.0
  expected_files:
    min_pass_rate: 1.0
  forbidden_labels:
    min_pass_rate: 1.0
  max_turns:
    min_pass_rate: 1.0
  max_cost:
    min_pass_rate: 1.0
