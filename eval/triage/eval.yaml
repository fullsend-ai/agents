name: triage-eval
description: Functional test of the fullsend triage agent pipeline

skill: triage

execution:
  mode: case
  timeout: 900  # 15 min — agent timeout is 10 min, plus setup/teardown
  parallelism: 4
  env:
    EVAL_ORG: $EVAL_ORG
    GH_TOKEN: $GH_TOKEN
    FULLSEND_DIR: $FULLSEND_DIR
    GOOGLE_APPLICATION_CREDENTIALS: $GOOGLE_APPLICATION_CREDENTIALS
    ANTHROPIC_VERTEX_PROJECT_ID: $ANTHROPIC_VERTEX_PROJECT_ID
    GOOGLE_CLOUD_PROJECT: $GOOGLE_CLOUD_PROJECT
    CLOUD_ML_REGION: $CLOUD_ML_REGION
    # Per-run runtime/model/effort for A/B comparisons (run-functional.sh
    # exports them; empty = use the workspace config / harness values).
    EVAL_RUNTIME: $EVAL_RUNTIME
    EVAL_MODEL: $EVAL_MODEL
    EVAL_EFFORT: $EVAL_EFFORT

hooks:
  before_each:
    - command: "setup-fixture.sh"
      timeout: 120
      description: "Create ephemeral repo and fixture"

  after_each:
    - command: "capture-fixture.sh"
      timeout: 30
      description: "Capture fixture state for judges"
    - command: "teardown-fixture.sh"
      timeout: 30
      on_failure: continue
      description: "Delete ephemeral repo"

runner:
  type: cli
  command:
    - "run-fullsend.sh"
    - "{agent}"
    - "{workspace}"
    - "{output_dir}"
  env:
    FULLSEND_DIR: $FULLSEND_DIR
    GH_TOKEN: $GH_TOKEN
    GOOGLE_APPLICATION_CREDENTIALS: $GOOGLE_APPLICATION_CREDENTIALS
    ANTHROPIC_VERTEX_PROJECT_ID: $ANTHROPIC_VERTEX_PROJECT_ID
    GOOGLE_CLOUD_PROJECT: $GOOGLE_CLOUD_PROJECT
    CLOUD_ML_REGION: $CLOUD_ML_REGION
    # Per-run runtime/model/effort for A/B comparisons (run-functional.sh
    # exports them; empty = use the workspace config / harness values).
    EVAL_RUNTIME: $EVAL_RUNTIME
    EVAL_MODEL: $EVAL_MODEL
    EVAL_EFFORT: $EVAL_EFFORT

models:
  skill: claude-sonnet-5-5
  # The harness forces tool_choice to get a structured judge verdict.
  # The eval Vertex project's org policy
  # (constraints/vertexai.allowedPartnerModelFeatures) allows structured
  # outputs for claude-sonnet-5 but not yet for claude-sonnet-5-5, which
  # returns 400 on forced tool_choice. Move the judge to
  # claude-sonnet-5-5 once the policy lists
  # claude-sonnet-5-5:structured_outputs (agents#1603).
  judge: claude-sonnet-5

dataset:
  path: cases
  schema: |
    Each case directory contains:
    - input.yaml: Fixture definition with forge, fixture type, title, body,
      and optional comments already on the issue (re-triage cases).
    - annotations.yaml: Expected fixture state (labels, comments, state).
    - repo/: Directory (or symlink) with the git repo contents the agent sees.

outputs:
  - path: output
    schema: |
      fixture-state.json: Captured state of the issue/PR after the
      full agent pipeline (pre-script, agent, post-script) has run.
      Contains: state, labels, comments, assignees, and for PRs: reviews.

# ---------------------------------------------------------------------------
# Judges
# ---------------------------------------------------------------------------
judges:
  - name: triage_quality
    # The rubric's scale. Declared, an off-scale score is recorded as a
    # judge error (counted by max_error_rate) instead of being accepted.
    score_range: [1, 5]
    description: |
      Evaluate the overall quality of the triage — not just whether labels
      were applied, but whether the agent's comment demonstrates understanding
      of the issue and provides actionable guidance.
    prompt: |
      You are evaluating a triage agent's work on an issue.

      The agent was given an issue filed against a repo, and ran a full
      triage pipeline: it read the source code, analyzed the issue, posted
      a comment, and applied labels.

      Here is the captured state of the issue after the agent ran (fixture
      state capped at 50,000 characters, well under the judge model's
      input limit; a trailing marker appears if truncation happened):
      {{ outputs.files.get("output/fixture-state.json", "") | truncate(50000, True, "\n\n...[TRUNCATED: fixture state exceeded 50,000 characters]") }}

      Here is what the test case author expects from a good triage of this
      specific issue, including what the agent should have noticed in the
      source code:
      {{ annotations }}

      Evaluate the quality of the triage on a 1-5 scale:

      1 = Wrong action or fundamentally misunderstood the issue
      2 = Correct action but missed key observations about the source code
      3 = Adequate — correct labels, reasonable comment, but accepted the
          issue at face value without critically examining the code
      4 = Good — identified the correct root cause, noticed discrepancies
          between the issue description and the actual code
      5 = Excellent — all of the above plus identified secondary issues
          and proposed actionable fixes with test cases

      Use the triage_expectations field in the annotations as your rubric
      for what a strong triage should include. Score based on how many of
      those expectations the agent met.

      Respond with just a number 1-5.

  - name: required_labels
    description: All required labels from annotations.yaml must be present
    check: |
      import json
      state = json.loads(outputs["files"]["output/fixture-state.json"])
      actual = [l.lower() for l in state.get("labels", [])]
      required = outputs.get("annotations", {}).get("labels", {}).get("required", [])
      if not required:
          return True, "No required labels specified"
      missing = [l for l in required if l.lower() not in actual]
      if missing:
          return False, f"Missing labels: {missing} (actual: {actual})"
      return True, f"All required labels present: {required}"

  - name: forbidden_labels
    description: Labels listed in annotations.yaml forbidden list must NOT be present
    check: |
      import json
      state = json.loads(outputs["files"]["output/fixture-state.json"])
      actual = [l.lower() for l in state.get("labels", [])]
      forbidden = outputs.get("annotations", {}).get("labels", {}).get("forbidden", [])
      if not forbidden:
          return True, "No forbidden labels specified"
      present = [l for l in forbidden if l.lower() in actual]
      if present:
          return False, f"Forbidden labels present: {present} (actual: {actual})"
      return True, f"No forbidden labels found (checked: {forbidden})"

  - name: expected_state
    description: The issue or PR must end in the state annotations.yaml expects
    check: |
      import json
      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found — capture-fixture.sh did not run or failed"
      expected = outputs.get("annotations", {}).get("state")
      if not expected:
          return True, "No expected state specified"
      actual = json.loads(raw).get("state")
      if not actual:
          return False, "State not captured — the forge read may have failed"
      # Annotations are lowercase; gh reports OPEN, CLOSED or MERGED.
      if str(actual).lower() != str(expected).lower():
          return False, f"Expected state {expected}, got {actual}"
      return True, f"State is {actual}"

  - name: cause_lists
    description: The run's sufficient comment carries the expected Open causes and Ruled out lists
    check: |
      import json, re
      spec = outputs.get("annotations", {}).get("cause_lists")
      if not spec:
          # Abstain, so cases without lists stay out of the pass rate and one
          # re-triage case that keeps failing cannot hide behind them.
          return None, "Not scored: no cause_lists expectations"
      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found"
      comments = [(c.get("body") or "") for c in json.loads(raw).get("comments") or []]
      # A misspelled key would silently drop its check, so unknown keys fail.
      unknown = sorted(set(spec) - {"seeded_comments", "seeded_folds", "open", "ruled_out",
                                    "forbidden_open", "forbidden_ruled_out", "unverified_open"})
      if unknown:
          return False, f"cause_lists has unknown key(s): {unknown}"
      # Required, so a case that seeds marked analyses can never have one of
      # them graded as the run's output by leaving the count out.
      if "seeded_comments" not in spec:
          return False, "cause_lists needs seeded_comments (0 when the fixture seeds no comments)"
      seeded = int(spec["seeded_comments"])
      marker = "<!-- fullsend:triage-agent -->"
      # The run's analysis is the newest marked comment after the seeded
      # ones. A fullsend that edits in place (before fullsend#9399) writes
      # it into the first seeded marked comment instead, above the folded
      # "Previous run" history; only the text above that fold is this run's.
      # A seeded comment may already hold Previous run folds: seeded_folds
      # lists how many each seeded comment holds, in order (missing entries
      # are 0). A seeded comment counts as edited in place only when it now
      # holds more than its own seeded count, so seeded text above a seeded
      # fold is never graded.
      appended = [b for b in comments[seeded:] if marker in b]
      if appended:
          text = appended[-1]
      else:
          folds = list(spec.get("seeded_folds") or [])
          folds += [0] * (seeded - len(folds))
          edited = [b for i, b in enumerate(comments[:seeded])
                    if b.count("<!-- sticky:history-start -->") > int(folds[i])]
          if not edited:
              return False, "No triage analysis from this run: no new marked comment and no seeded comment edited in place"
          text = edited[0]
      text = re.split(r"<details>\s*<summary>Previous run", text, maxsplit=1)[0].lower()
      # Headings are matched loosely: "**Open causes:**", "**Open causes**:",
      # "**Open causes**" or a "### Open causes" heading. A section runs to
      # the next such heading or the first horizontal rule.
      head = r"(?m:^)[ \t]*(?:\*\*\s*{0}\s*(?:\([^)\n]*\))?\s*:?\s*\*\*\s*(?:\([^)\n]*\))?:?|#{{1,6}}\s*{0}\s*(?:\([^)\n]*\))?\s*:?)[ \t]*$"
      any_head = r"\n\s*(?:\*\*[^*\n]+\*\*\s*(?:\([^)\n]*\))?:?[ \t]*\n|#{1,6}\s)"
      def section(name):
          m = re.search(head.format(name) + r"(.*?)(?=" + any_head + r"|\n-{3,}[ \t]*(?:\n|$)|\Z)", text, re.S | re.M)
          return m.group(1) if m else None
      open_s, ruled_s = section("open causes"), section("ruled out")
      if open_s is None:
          return False, "No Open causes list in the run's analysis"
      # Phrases are matched only in each list item's cause name (the text
      # before its evidence: a spaced dash, as the prompt's template writes
      # it, or an unspaced em dash; an unspaced en dash, as in "3–5", stays
      # in the name), so evidence that mentions a cause never counts as
      # listing it. A colon is part of the name: cutting there would hide a
      # restored cause written "Cause: regex rejects '+'".
      item = re.compile(r"^\s*(?:[-*+]|\d+[.)])\s+(.*)$")
      def name(line):
          return re.split(r"\s[—–-]\s|—", line, maxsplit=1)[0]
      def names(s):
          return [name(m.group(1)) for m in (item.match(line) for line in (s or "").splitlines()) if m]
      open_n = names(open_s)
      # The size fold writes the oldest Ruled out entries as one line,
      # "Also ruled out (see earlier analysis): a; b; c" (agents/triage.md,
      # comment rules), as a list item or a plain line, label bold or not,
      # after a colon or a
      # spaced dash. Each ";"-separated name on it counts, cut at its
      # evidence like a list item's, so a note after a dash is not a name. Any other plain line under Ruled
      # out is prose and counts for nothing, and Open causes reads list
      # items only, so prose there can never trip forbidden_open.
      fold = re.compile(r"^\s*(?:(?:[-*+]|\d+[.)])\s+)?\*{0,2}also ruled out\b[^:\n]*?(?::\*{0,2}|\s[—–-]\s|—)\s*(.+)$")
      ruled_n = []
      for line in (ruled_s or "").splitlines():
          f, m = fold.match(line), item.match(line)
          if f:
              ruled_n += [name(n) for n in f.group(1).split(";") if n.strip()]
          elif m:
              ruled_n.append(name(m.group(1)))
      problems = []
      groups = lambda key: [[g] if isinstance(g, str) else list(g) for g in spec.get(key) or []]
      for group in groups("open"):
          if not any(p.lower() in n for p in group for n in open_n):
              problems.append(f"Open causes lacks any of {group}")
      for group in groups("ruled_out"):
          if not any(p.lower() in n for p in group for n in ruled_n):
              problems.append(f"Ruled out lacks any of {group}")
      # A forbidden entry is a phrase or a list of phrases that must all
      # appear in the same cause name. A regex character class with no
      # spaces and a range or an escape, such as [a-zA-Z0-9._%+-], is cut
      # first, with any quantifier after it ("+", "*", "?", "{2,}"), so a
      # cause that quotes the pattern does not match a "+"
      # phrase; "[+]" or a markdown link's text ("[a-b](url)") is kept.
      bare_open = [re.sub(r"\[[^\]\s]*(?:\w-\w|\\)[^\]\s]*\](?!\()(?:[+*?]|\{\d*,?\d*\})?", "", n) for n in open_n]
      for p in spec.get("forbidden_open") or []:
          parts = [p] if isinstance(p, str) else list(p)
          if any(all(q.lower() in n for q in parts) for n in bare_open):
              problems.append(f"Open causes lists {p!r}, which should stay ruled out")
      # forbidden_ruled_out: AND-groups no Ruled out name may match, for a
      # cause nothing on the issue or in the code can refute, which step 2e
      # says is never ruled out without such evidence.
      for p in spec.get("forbidden_ruled_out") or []:
          parts = [p] if isinstance(p, str) else list(p)
          if any(all(q.lower() in n for q in parts) for n in ruled_n):
              problems.append(f"Ruled out lists {p!r}, which no evidence here refutes")
      # An unverified_open group names a cause the run may carry only as a
      # hypothesis (a cause found only in a Previous run fold). Leaving it
      # out passes; an Open causes item whose name matches it passes only
      # with the "(unverified)" marker step 2e writes, in the name or at
      # the item's end.
      items = [m.group(1) for m in (item.match(line) for line in (open_s or "").splitlines()) if m]
      for group in groups("unverified_open"):
          for it in items:
              nm = name(it)
              # Emphasis around the marker ("_(unverified)_") is ignored.
              plain = re.sub(r"[*_]", "", it)
              if (any(p.lower() in nm for p in group) and "(unverified)" not in name(plain)
                      and not plain.rstrip(" .").endswith("(unverified)")):
                  problems.append(f"Open causes lists {nm.strip()!r} without the (unverified) marker; it may only be carried as a hypothesis")
      if problems:
          return False, "; ".join(problems)
      return True, "Open causes and Ruled out lists match"

  - name: max_turns
    description: Agent must complete within the declared turn budget
    check: |
      import json
      raw = outputs["files"].get("output/metrics.json")
      if not raw:
          return False, "metrics.json not found"
      metrics = json.loads(raw)
      actual = metrics.get("num_turns")
      if actual is None:
          return False, "num_turns not present in metrics.json"
      limit = outputs.get("annotations", {}).get("max_turns")
      if limit is None:
          return False, "max_turns not declared in annotations.yaml"
      if int(actual) > int(limit):
          return False, f"Exceeded max_turns: {actual} > {limit}"
      return True, f"Turns OK: {actual} <= {limit}"

  - name: max_cost
    description: Agent must complete within the declared cost budget
    check: |
      import json
      raw = outputs["files"].get("output/metrics.json")
      if not raw:
          return False, "metrics.json not found"
      metrics = json.loads(raw)
      actual = metrics.get("total_cost_usd")
      if actual is None:
          return False, "total_cost_usd not present in metrics.json"
      limit = outputs.get("annotations", {}).get("max_cost_usd")
      if limit is None:
          return False, "max_cost_usd not declared in annotations.yaml"
      if float(actual) > float(limit):
          return False, f"Exceeded max_cost_usd: {actual} > {limit}"
      return True, f"Cost OK: {actual} <= {limit}"

# ---------------------------------------------------------------------------
# Thresholds
# ---------------------------------------------------------------------------
# max_turns and max_cost run and report but gate nothing: per-case turn
# counts and cost vary run to run far more than any regression they have
# caught (none since 2026-08), so a budget miss is not a failure.
thresholds:
  triage_quality:
    # TODO: raise to 3.5 once the triage agent critically examines source
    # code instead of accepting issue descriptions at face value.
    min_mean: 2.5
    # Coverage gate, as on review_quality: fail when the judge errored on
    # more than a fifth of the cases instead of averaging the survivors.
    max_error_rate: 0.2
  required_labels:
    min_pass_rate: 0.9
  forbidden_labels:
    min_pass_rate: 0.9
  expected_state:
    min_pass_rate: 0.9
  # cause_lists has no threshold yet, so it is scored in each run's summary
  # but is not part of the nightly verdict, until cases 007 and 013-021 have
  # run against a live model three times, matching the nightly vote
  # (fullsend-ai/agents#2043). It is scored only on cases that declare it.
