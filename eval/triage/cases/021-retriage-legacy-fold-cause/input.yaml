fixture:
  type: issue
  title: "Login returns 500 for some users"
  body: |
    Since last week a few users get an HTTP 500 when they submit the
    login form. Most users can log in fine. The server log shows
    `TypeError: expected string or bytes-like object` from `re.match` in
    `validate_email` (`src/auth/validators.py`), called from
    `login_handler`.

    Steps to reproduce: POST the login form with a password and no
    email field. Expected a validation message, got a 500.

    Environment: current main, Python 3.12.
  # One legacy analysis (written before triage-state-v1, so no state marker)
  # that fullsend edited in place: its current text, then a "Previous run"
  # fold holding the run before it, in the shape BuildUpdatedBody in
  # fullsend's internal/sticky/sticky.go writes (the old text's own marker
  # cut, sentinel comments around it). The fold calls the authgw gateway
  # stripping the email parameter "confirmed"; the current text leaves it
  # out without a ruling, and nothing else names it. With no state, step 2e
  # rebuilds from every comment, fold copies included, as claims: authgw
  # goes in open_causes with verified false, never asserted or ruled out.
  comments:
