      - The authgw gateway strips the email parameter before the request reaches login_handler — confirmed: the gateway log shows every failing request as `authgw: POST /login fwd params=[password]`.

      **Ruled out:**
      - validate_email rejects '+' in the local part — the pattern's local-part class includes '+'.

