# Re-triage carries the prior analysis forward (fullsend-ai/agents#2042).
# Two earlier triage comments are on the issue: run 1 listed two causes,
# run 2 ruled out the second with evidence. The eval account posted both,
# so neither is a trusted baseline and the agent rebuilds the lists from
# them, oldest first. The new human comment adds no evidence about
# either cause, so run 3 must keep the open cause and must not restore
# the ruled-out one from run 1's older comment.
state: open

labels:
  required:
    - ready-to-code
    - bug

# Checked by the cause_lists judge on the run's own comment.
cause_lists:
  seeded_comments: 3
  open:
    - ["none", "missing email", "email field", "no email", "typeerror"]
  ruled_out:
    - ["+", "plus"]
  # A plus together with a rejection claim is the ruled-out cause back.
  # Narrow on purpose: wider pairs ("invalid", "fail") also match a correct
  # ValueError cause that names a plus address. The rubric covers rewordings.
  forbidden_open: [["+", "reject"], ["plus", "reject"]]

max_turns: 35
max_cost_usd: 0.50

triage_expectations: |
  The issue already has two triage analyses. They were posted by the
  eval account, not a triage bot, so the agent rebuilds both lists from
  them, oldest first, with later evidence winning. The newer one's Open
  causes list has one cause (a missing email field
  reaches validate_email as None, and re.match raises TypeError) and its
  Ruled out list has one entry (the regex rejecting '+', refuted because
  the pattern's local-part character class includes '+'). The latest
  human comment asks for progress and adds no evidence.

  The code confirms both: login_handler passes request.params.get("email")
  to validate_email unchecked, and the pattern accepts '+'. The
  docstring's BUG note is stale. login_handler also does not catch the
  ValueError validate_email raises for a malformed address, which is a
  second way to get a 500.

  Where to find the agent's analysis: it is the newest comment on the
  issue that is not one of the three seeded comments. If no such
  comment exists, a fullsend that edits marked comments in place
  (before fullsend-ai/fullsend#9399) wrote it into a seeded marked
  comment, above a "Previous run" block holding that comment's old text; the
  agent's analysis is then the text above that block. Grade only text
  the agent wrote, never the seeded run 1 or run 2 text. If the agent
  posted nothing, score 1.

  A good triage should:

  1. Apply run 2's refutation to run 1's causes: later evidence wins
     over the older comment that still describes the '+' cause.
  2. Keep the None cause under Open causes.
  3. Keep the '+' cause under Ruled out, with its evidence, and not list
     it as an open cause or a hypothesis anywhere in the comment.
  4. End the comment with the Open causes list and a Ruled out list.
  5. Keep the comment under 4000 characters and not restate the earlier
     analyses at length.
  6. Ideally add the unhandled ValueError as a new open cause, with
     evidence from login_handler.

  Scoring guide:
  A score of 1 means the agent restored the '+' cause as open, or
  dropped the None cause.
  A score of 2 means both causes are right in the prose, but the comment
  has no Open causes or Ruled out list, so the next run cannot read the
  state.
  A score of 3 means both lists are present and correct, but the comment
  repeats the earlier analyses at length or misses the ValueError path.
  A score of 4 means both lists are correct and concise, and the comment
  adds net-new value (a test case or the ValueError path).
  A score of 5 means all of the above: the None cause is open, the '+'
  cause stays ruled out with its evidence, the ValueError path is added
  as a new open cause, and the comment is concise.
