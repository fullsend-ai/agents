      - `/fs-code <your instruction>` — agent implements with your specific guidance
    - |
      Thanks for the details. Did the 500s start with a particular
      deploy, or were they there before last week?
    - |
      Not sure yet, I'll check the deploy history. Can this be picked up meanwhile?
    - |
      <!-- fullsend:triage-agent -->
      Re-checked the handler after the reporter's reply.

