  type: issue
  title: 'RHAI-331: Deprecate /v1/guardrail/checks and Align with Upstream /v1/checks Endpoint'
  body: |-
    Deprecate /v1/guardrail/checks and Align with Upstream /v1/checks Endpoint
    Description
    Carry the upstream
    /v1/checks
     endpoint from NeMo Guardrails (established via PR #2013) into the RHOAI downstream fork, register it as a new FastAPI route in the NeMo Guardrails server, and deprecate the existing
    /v1/guardrail/checks
     endpoint with standard HTTP deprecation headers and a documented migration path. Both endpoints share the same underlying handler function to ensure identical behavior. Reconcile any behavioral differences between the current downstream
    /v1/guardrail/checks
     implementation and the upstream
    /v1/checks
     contract, with upstream behavior taking precedence.
    Scope
    Cherry-pick or reconcile the upstream
    /v1/checks
     implementation from PR #2013 into the RHOAI downstream fork of NeMo Guardrails
    Register
    /v1/checks
     as a new FastAPI route in
    nemoguardrails/server/api.py
     pointing to the upstream handler logic
    Refactor the existing
    /v1/guardrail/checks
     route and the new
    /v1/checks
     route to share the same underlying handler function
    Add standard HTTP deprecation headers (
    Deprecation: true
    ,
    Sunset: <date>
    ,
    Link: </v1/checks>; rel="successor-version"
    ) to all
    /v1/guardrail/checks
     responses
    Add server startup log warning noting
    /v1/guardrail/checks
     deprecation
    If RHAISTRAT-2323 (output rail evaluation) has landed, ensure the
    rail_types
     parameter is applied to
    /v1/checks
     via the shared handler
    Acceptance Criteria
    Given a NeMo Guardrails server with default configuration, when a client sends a POST request to
    /v1/checks
     with a valid check payload, then the server returns a successful response with guardrail evaluation results matching the upstream NeMo Guardrails response contract, measured by response status 200 and response body conforming to the upstream
    /v1/checks
     schema.
    Given a NeMo Guardrails server with default configuration, when a client sends a POST request to
    /v1/guardrail/checks
     with the same payload, then the server returns the same evaluation results as
    /v1/checks
     plus HTTP deprecation headers (
    Deprecation
    ,
    Sunset
    ,
    Link
    ), measured by response body equality and presence of all three deprecation headers.
    Given identical request payloads sent to
    /v1/checks
     and
    /v1/guardrail/checks
    , when both endpoints process the request, then the guardrail evaluation results are byte-for-byte identical (excluding deprecation headers), measured by automated parity test comparing response bodies.
    Given the NeMo Guardrails server starting up, when the server initializes, then a deprecation warning is logged noting that
    /v1/guardrail/checks
     is deprecated in favor of
    /v1/checks
    , measured by the presence of the warning in server startup logs.
    The specific behavioral differences between the current downstream
    /v1/guardrail/checks
     and the upstream
    /v1/checks
     have been identified and reconciled, with upstream behavior taking precedence.
    The target Sunset date for
    /v1/guardrail/checks
     removal has been determined (PM decision) and is reflected in the
    Sunset
     HTTP header value.
    HLR Traceability
    [P0] Register `/v1/checks` endpoint with behavior matching upstream
    : Covered by this epic's scope (cherry-pick/reconcile upstream implementation, register route).
    [P0] Retain `/v1/guardrail/checks` during deprecation period with deprecation response headers
    : Covered by this epic's scope (add deprecation headers to existing route).
    [P0] Both endpoints share the same handler and return identical results
    : Covered by this epic's scope (refactor to shared handler, parity test).
    [P2] Add server startup log warning noting `/v1/guardrail/checks` deprecation
    : Covered by this epic's acceptance criteria (AC 4).
    Risks
    Upstream behavioral drift
    : The downstream
    /v1/guardrail/checks
     implementation may have diverged from the upstream
    /v1/checks
     contract, requiring more reconciliation than a simple cherry-pick. Mitigation: Diff the downstream handler against the upstream PR #2013 implementation early to scope the delta.
    Client breakage from schema differences
    : If the upstream
    /v1/checks
     schema differs from the current
    /v1/guardrail/checks
     schema, clients migrating may encounter unexpected breaking changes. Mitigation: Document all schema differences in the migration guide.
    Assumptions
    The upstream
    /v1/checks
     implementation from PR #2013 has been merged and is available for cherry-picking (needs validation).
    The RHOAI downstream fork is close enough to the upstream version that cherry-picking is feasible without major conflict resolution (needs validation).
    The deprecation period of one RHOAI release cycle is acceptable to PM and customers (needs validation).
