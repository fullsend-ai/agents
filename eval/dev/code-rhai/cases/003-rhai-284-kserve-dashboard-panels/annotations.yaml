# Pass-to-pass: the repository's own test command, run on the agent's PR head
# from the repo root (capture-pr-artifacts.sh). Use what the repo's CI runs.
# kserve's full `make test` needs envtest binaries and runs for a long time;
# the epic only touches Grafana dashboard definitions under config/. This
# checks the tree still builds, every dashboard file is valid YAML, and two
# fast pure-Go packages pass. Measured 2026-09-25: 42 s on the bare snapshot.
regression_tests:
  command: "go build ./... && for f in config/monitoring/llmisvc/dashboards/*.yaml; do yq e '.' \"$f\" >/dev/null || exit 1; done && go test ./pkg/utils/... ./pkg/constants/..."
test_timeout_s: 1800

