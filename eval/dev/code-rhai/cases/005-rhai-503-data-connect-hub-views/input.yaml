fixture:
  type: issue
  title: 'RHAI-503: Data Connect Hub Module — Connection List and Detail Views'
  body: |-
    Data Connect Hub Module — Connection List and Detail Views
    Description
    Create the
    data-connect-hub
     Module Federation plugin at
    packages/data-connect-hub/
     in odh-dashboard, following the established pattern used by gen-ai, model-registry, and other feature modules. This epic delivers the module scaffold (package structure, Module Federation config exposing
    ./extensions
     and
    ./extension-points
    , routing, module BFF sidecar) and two primary read-side views: Connection List and Connection Detail. The module BFF handles DCH-specific orchestration logic that does not belong in the common BFF layer. Product analytics events for connection discovery and usage workflows are instrumented within these views.
    Scope
    Module scaffold:
    packages/data-connect-hub/
     directory structure, Module Federation config, extension point registration (
    app.route
    ,
    app.navigation/href
    ), module BFF sidecar
    Connection List view: PatternFly table displaying tenant-scoped DataConnection resources with type icon, name, status badge (healthy/unhealthy/untested), and last-validated timestamp
    Filter toolbar: filtering by connection type, status, and tags
    Polling-based status updates against the DCHS REST API (via common BFF endpoints) for connection status changes
    Empty state with guidance to create a first connection when namespace has zero connections
    Backend-unavailable error state when DCHS is unreachable
    Connection Detail view: metadata display (type, purpose, access pattern, tags, schema hints), health status with last validation result, masked credentials
    Inline edit actions for users with edit RBAC to update credentials and metadata
    Coexistence UX: contextual banners/links helping users understand the difference between the new DCH connections and existing Data Science Project connections
    SSAR-gated visibility in the frontend matching BFF authorization
    Product analytics events for end-user discovery and usage workflows (browsing, filtering, selecting, opening connections) via existing Segment integration
    WCAG 2.1 AA compliance with zero axe-core violations
    Acceptance Criteria
    Users with tenant access see a list of DataConnection resources in their tenant scope with type, name, status, and last validated timestamp
    Filter toolbar updates the list to show only connections matching applied filter values for connection type, status, or tags
    Connection Detail page displays metadata (type, purpose, access pattern, tags, schema hints) with credentials masked by default
    Credential field values do not appear in the rendered DOM or analytics payloads
    Authorized users can update credentials and metadata via inline edit actions
    Empty state component renders when the DCHS API returns an empty collection for the namespace
    Non-interactive error state renders when the DCHS backend is unreachable, with a descriptive error message
    Module Federation plugin registers routes and navigation items via the extension point system
    Coexistence UX banners/links distinguish the new DCH connections from existing Data Science Project connections
    Polling-based updates reflect connection status changes in the list view
    Product analytics events are emitted for connection discovery and usage workflows, with payloads following existing dashboard analytics conventions and containing no credentials or PII
    All views pass axe-core automated audit at WCAG 2.1 AA level with zero violations
    HLR Traceability
    [P0] Connection List view with tenant-scoped, filterable list of DataConnection resources showing type, name, status, and last validated timestamp
    [P0] Connection Detail view displaying metadata, health status, and masked credentials with edit capability for authorized users
    [P0] SSAR-based access control (frontend visibility enforcement)
    [P1] Product analytics events for end-user discovery/usage workflows (bundled — tightly coupled to view components)
    Risks
    Real-time update strategy for DataConnection status changes is unresolved. Polling is the known fallback; interval or SSE endpoint specification needed from the Data Connect Hub team.
    UXD design specifications for connection management views may not be available; initial implementation follows existing dashboard UI patterns and iterates based on UXD feedback.
  labels:
  - ready-to-code
