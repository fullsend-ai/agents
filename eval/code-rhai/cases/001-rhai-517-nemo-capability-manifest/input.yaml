  title: 'RHAI-517: NeMo-Guardrails Capability Manifest Endpoint'
  body: "NeMo-Guardrails Capability Manifest Endpoint\nDescription\nAdd a read-only JSON manifest endpoint to the NeMo-Guardrails fork's FastAPI server that describes the fork's identity, version, upstream divergences, fork-specific API endpoints with behavioral contracts, documentation pointers, and TrustyAI integration points. The manifest is auto-generated at server startup from FastAPI route introspection and static metadata files shipped in the container image, keeping it synchronized with the deployed version and preventing content drift.\nScope\nAdd a new read-only GET route at a well-known URL to the NeMo-Guardrails FastAPI server (e.g., \n/.well-known/ai-plugin.json\n -- final path to be aligned with the EvalHub team on a platform Agent Discoverability contract)\nImplement manifest content generation at server startup using FastAPI's route introspection (\napp.openapi()\n and registered route enumeration) combined with static metadata files\nShip static metadata files in the container\
    \ image containing fork identity, upstream delta summary, documentation pointers, and TrustyAI integration metadata (NemoGuardrails CRD reference at \ntrustyai.opendatahub.io/v1alpha1\n, configuration schema references for \nMAIN_MODEL_ENGINE\n, \nMAIN_MODEL_BASE_URL\n, Authorization header forwarding)\nThe manifest JSON document includes: (1) fork identity, version, upstream NeMo-Guardrails version with divergence summary; (2) catalog of fork-specific HTTP endpoints (\n/v1/guardrail/checks\n, \n/v1/checks\n, \n/v1/actions/list\n, \n/v1/actions/run\n, \n/v1/challenges\n) with methods and behavioral contracts; (3) documentation pointers; (4) TrustyAI integration via NemoGuardrails CRD; (5) configuration schema references\nThe endpoint is unauthenticated, consistent with the fork's existing no-built-in-auth model\nNo existing endpoints are modified; the manifest route is purely additive\nAcceptance Criteria\nGiven a deployed NeMo-Guardrails fork instance, when an HTTP GET request is sent\
    \ to the well-known manifest URL, then the server returns HTTP 200 with a valid JSON document containing fork identity, version, upstream delta summary, and fork-specific endpoint catalog\nGiven the manifest document, when parsed for fork-specific endpoints, then \n/v1/guardrail/checks\n is listed with its behavioral contract (evaluates messages against input/output rails without generating LLM responses), and \n/v1/checks\n, \n/v1/actions/list\n, \n/v1/actions/run\n are included with method and behavioral contract fields populated\nManifest includes documentation pointers and TrustyAI integration points (NemoGuardrails CRD reference, configuration schema for \nMAIN_MODEL_ENGINE\n, \nMAIN_MODEL_BASE_URL\n, Authorization header forwarding)\nManifest content is auto-generated from FastAPI route introspection at server startup; the deployed manifest always reflects the actual registered routes\nIf manifest generation fails at startup, the server health check fails, preventing deployment\
    \ of a server with a stale or broken manifest\nThe manifest endpoint is available without per-developer or per-agent configuration -- same well-known URL for all clients reaching the NeMo-Guardrails Service within the cluster\nGiven a NeMo-Guardrails fork deployed without the manifest feature (older version), when a request is sent to the well-known manifest URL, then the server returns HTTP 404\nThe manifest contains only structural metadata (endpoint paths, schemas, documentation pointers) -- no secrets, credentials, or runtime state\nManifest URL path aligned with EvalHub team on a platform Agent Discoverability contract before finalizing\nHLR Traceability\n[P0] NeMo-Guardrails fork exposes a machine-readable capability manifest at a well-known URL returning fork identity, version, upstream delta summary, and fork-specific endpoint catalog with behavioral contracts\n[P0] Manifest includes documentation pointers and TrustyAI integration points (NemoGuardrails CRD reference, configuration\
    \ schema)\n[P1] Manifest content auto-generated from FastAPI route introspection at startup to prevent drift from deployed endpoints\nRisks\nManifest content drift\n: Mitigated by generating manifest at startup from route introspection and static metadata; health check fails if generation fails\nAgent retrieval accuracy\n: Mitigated by structured manifest with unambiguous endpoint descriptions and behavioral contracts; validate with at least two AI agents during acceptance testing\nOpen Questions\nShould the manifest URL path be standardized across all RHOAI components? (Owner: Platform architecture) -- affects URL path design; EvalHub team coordination prerequisite implies alignment is expected\nDoes the manifest need to be accessible from outside the cluster? (Owner: Platform team) -- deferred to platform team decision; out of scope for initial delivery"
