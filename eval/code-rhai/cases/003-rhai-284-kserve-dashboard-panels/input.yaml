  title: 'RHAI-284: Implement pod-level and model-level dashboard panels (P11-P20)'
  body: "Implement pod-level and model-level dashboard panels (P11-P20)\nDescription\nAdd 10 new panels to the existing llm-d Perses observability dashboards, covering per-pod diagnostics (P11-P16) and per-model business metrics (P17-P20). Panels are defined as PersesDashboard custom resource entries in the kserve repo at \nconfig/monitoring/llmisvc/dashboards/\n. All panels consume existing vLLM and EPP Prometheus metrics via PromQL queries grouped by \nk8s_pod_name\n or \nmodel_name\n labels. No new metric collection infrastructure is required.\nScope\nPod-level panels (P11-P16):\nP11: Per-pod request distribution -- rate of \nkserve_vllm:num_requests_running\n by \nk8s_pod_name\n, showing routing imbalance across pods in the InferencePool\nP12: Per-pod queue depth -- \nkserve_vllm:num_requests_waiting\n by \nk8s_pod_name\nP13: Per-pod KV cache usage -- \nkserve_vllm:kv_cache_usage_perc\n by \nk8s_pod_name\nP14: Per-pod prefix cache hit rate -- derived from \nkserve_vllm:prefix_cache_hits_total\n\
    \ / \nkserve_vllm:prefix_cache_queries_total\n by \nk8s_pod_name\nP15: Per-pod preemption counts -- \nkserve_vllm:num_preemptions_total\n by \nk8s_pod_name\nP16: EPP pool health -- endpoint count, healthy vs. unhealthy endpoints, and scheduling decision distributions from EPP metrics on port 9090/TCP\nModel-level panels (P17-P20):\nP17: Per-model TTFT -- \nkserve_vllm:time_to_first_token_seconds\n by \nmodel_name\n for SLA compliance\nP18: Per-model error rate -- \ninference_model_request_error_total\n by \nmodel_name\nP19: Per-model token consumption -- \nkserve_vllm:generation_tokens_total\n and \nkserve_vllm:prompt_tokens_total\n by \nmodel_name\n for chargeback extraction\nP20: Per-model traffic distribution -- request volume by \nmodel_name\nCross-cutting:\nVerify metric availability for all referenced vLLM metrics (port 8000/TCP \n/metrics\n) and EPP metrics (port 9090/TCP \n/metrics\n)\nUse the same \nkserve_vllm:\n metric prefix as existing P1-P10 panels\nLeverage existing \n\
    $namespace\n and \n$model_name\n template variables for per-model filtering\nValidate panels render correctly with existing P1-P10 panels (regression testing)\nAcceptance Criteria\nPod-level panels P11-P16 render distinct time series per \nk8s_pod_name\n label in a multi-pod deployment with 3+ pods\nModel-level panels P17-P20 render distinct series per \nmodel_name\n label in a multi-model deployment with 2+ models served through separate LLMInferenceService instances\nP11 visually exposes routing imbalance across pods in the InferencePool (suitable for troubleshooting uneven load distribution)\nP19 per-model token consumption data is suitable for chargeback extraction by finance teams\nAll original P1-P10 panels continue to return non-error PromQL results and render the same number of time series as before the P11-P20 deployment\nSingle-model deployments: model-level panels P17-P20 display data for the single model without errors (at least one time series)\nP16 EPP pool health panel\
    \ displays endpoint status and scheduling distributions from EPP metrics on port 9090/TCP\nPanel definitions are authored as PersesDashboard CRD entries consistent with the existing P1-P10 panel format\nKServe team code review and merge completed\nHLR Traceability\nHLR-1 [P0]: Pod-level panels (P11-P16) break down vLLM metrics by individual pod within an InferencePool\nHLR-2 [P0]: Model-level panels (P17-P20) break down latency, error rate, and token metrics by model_name label\nHLR-4 [P1]: Per-pod request distribution (P11) visually exposes routing imbalance across pods\nHLR-5 [P1]: Per-model token consumption (P19) suitable for chargeback extraction by finance teams\nHLR-6 [P1]: Existing P1-P10 panels continue to render correctly after P11-P22 deployment\nAssumptions\nvLLM exposes \nmodel_name\n label on all standard inference metrics (confirmed via code review; set from \n--served-model-name\n at startup)\nPerses dashboard framework from RHAISTRAT-1685 is deployed and available in\
    \ RHOAI 3.5\nPodMonitor resources are deployed for llm-d model server pods (established by P1-P10 framework)\nEPP exposes scheduling and pool health metrics on port 9090/TCP\nRisks\nPer-model panels cannot distinguish LoRA adapters; vLLM labels all metrics with the base model name regardless of which LoRA adapter served the request. Document that per-model panels apply to separate LLMInferenceService instances.\nKServe team review bottleneck: engage KServe team early with a consolidated PR."
