  title: 'RHAI-331: Deprecate /v1/guardrail/checks and Align with Upstream /v1/checks Endpoint'
  body: "Deprecate /v1/guardrail/checks and Align with Upstream /v1/checks Endpoint\nDescription\nCarry the upstream \n/v1/checks\n endpoint from NeMo Guardrails (established via PR #2013) into the RHOAI downstream fork, register it as a new FastAPI route in the NeMo Guardrails server, and deprecate the existing \n/v1/guardrail/checks\n endpoint with standard HTTP deprecation headers and a documented migration path. Both endpoints share the same underlying handler function to ensure identical behavior. Reconcile any behavioral differences between the current downstream \n/v1/guardrail/checks\n implementation and the upstream \n/v1/checks\n contract, with upstream behavior taking precedence.\nScope\nCherry-pick or reconcile the upstream \n/v1/checks\n implementation from PR #2013 into the RHOAI downstream fork of NeMo Guardrails\nRegister \n/v1/checks\n as a new FastAPI route in \nnemoguardrails/server/api.py\n pointing to the upstream handler logic\nRefactor the existing \n/v1/guardrail/checks\n\
    \ route and the new \n/v1/checks\n route to share the same underlying handler function\nAdd standard HTTP deprecation headers (\nDeprecation: true\n, \nSunset: <date>\n, \nLink: </v1/checks>; rel=\"successor-version\"\n) to all \n/v1/guardrail/checks\n responses\nAdd server startup log warning noting \n/v1/guardrail/checks\n deprecation\nIf RHAISTRAT-2323 (output rail evaluation) has landed, ensure the \nrail_types\n parameter is applied to \n/v1/checks\n via the shared handler\nAcceptance Criteria\nGiven a NeMo Guardrails server with default configuration, when a client sends a POST request to \n/v1/checks\n with a valid check payload, then the server returns a successful response with guardrail evaluation results matching the upstream NeMo Guardrails response contract, measured by response status 200 and response body conforming to the upstream \n/v1/checks\n schema.\nGiven a NeMo Guardrails server with default configuration, when a client sends a POST request to \n/v1/guardrail/checks\n\
    \ with the same payload, then the server returns the same evaluation results as \n/v1/checks\n plus HTTP deprecation headers (\nDeprecation\n, \nSunset\n, \nLink\n), measured by response body equality and presence of all three deprecation headers.\nGiven identical request payloads sent to \n/v1/checks\n and \n/v1/guardrail/checks\n, when both endpoints process the request, then the guardrail evaluation results are byte-for-byte identical (excluding deprecation headers), measured by automated parity test comparing response bodies.\nGiven the NeMo Guardrails server starting up, when the server initializes, then a deprecation warning is logged noting that \n/v1/guardrail/checks\n is deprecated in favor of \n/v1/checks\n, measured by the presence of the warning in server startup logs.\nThe specific behavioral differences between the current downstream \n/v1/guardrail/checks\n and the upstream \n/v1/checks\n have been identified and reconciled, with upstream behavior taking precedence.\n\
    The target Sunset date for \n/v1/guardrail/checks\n removal has been determined (PM decision) and is reflected in the \nSunset\n HTTP header value.\nHLR Traceability\n[P0] Register `/v1/checks` endpoint with behavior matching upstream\n: Covered by this epic's scope (cherry-pick/reconcile upstream implementation, register route).\n[P0] Retain `/v1/guardrail/checks` during deprecation period with deprecation response headers\n: Covered by this epic's scope (add deprecation headers to existing route).\n[P0] Both endpoints share the same handler and return identical results\n: Covered by this epic's scope (refactor to shared handler, parity test).\n[P2] Add server startup log warning noting `/v1/guardrail/checks` deprecation\n: Covered by this epic's acceptance criteria (AC 4).\nRisks\nUpstream behavioral drift\n: The downstream \n/v1/guardrail/checks\n implementation may have diverged from the upstream \n/v1/checks\n contract, requiring more reconciliation than a simple cherry-pick. Mitigation:\
    \ Diff the downstream handler against the upstream PR #2013 implementation early to scope the delta.\nClient breakage from schema differences\n: If the upstream \n/v1/checks\n schema differs from the current \n/v1/guardrail/checks\n schema, clients migrating may encounter unexpected breaking changes. Mitigation: Document all schema differences in the migration guide.\nAssumptions\nThe upstream \n/v1/checks\n implementation from PR #2013 has been merged and is available for cherry-picking (needs validation).\nThe RHOAI downstream fork is close enough to the upstream version that cherry-picking is feasible without major conflict resolution (needs validation).\nThe deprecation period of one RHOAI release cycle is acceptable to PM and customers (needs validation)."
