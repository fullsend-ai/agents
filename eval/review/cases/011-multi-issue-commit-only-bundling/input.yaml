    - path: docs/plans/rate-limiter-design.md
      content: |
        # Rate Limiter Design Doc

        ## Problem

        Unbounded request bursts from a single caller can starve other
        tenants of capacity.

        ## Plan

        1. Add a token-bucket limiter keyed by caller identity.
        2. Return 429 with a Retry-After header once the bucket is
           empty.
        3. Expose bucket size and refill rate as per-tenant config.

        ## Rollout

        Ship in shadow mode (log-only) first, then flip to enforcing
        once false-positive throttling is confirmed to be negligible.
