# Expected fixture state after the review agent runs.
#
# Renovate-style single-line patch bump. The agent should approve or
# comment without inventing a blocker.
state: open

labels:
  required: []
  forbidden:
    - rejected

required_findings: []

# An empty category forbids ANY finding on this file at or above the floor
# (see eval.yaml's forbidden_findings judge). The floor stays at the default
# "high": a low-severity "no changelog link provided" note is a legitimate
# observation on a bot bump, but nothing in a one-line patch bump justifies
# a high/critical finding.
#
# Advisory check — re-run this whenever the pins are touched, because the
# premise below ("no security surface") is a claim about the destination,
# not only about the delta. Every pin in the file, before and after the
# bump, must be free of published advisories:
#
#   gh api '/advisories?ecosystem=pip&affects=requests@2.33.0'
#   gh api '/advisories?ecosystem=pip&affects=requests@2.33.1'
#   gh api '/advisories?ecosystem=pip&affects=flask@3.1.3'
#
# All three returned an empty list on 2026-09-05. The earlier
# requests 2.32.x pins did not: GHSA-9hjg-9r4m-mvj7 (< 2.32.4) and
# GHSA-gc5v-m9x4-r6x2 (< 2.33.0) both affect them, which made a genuine
# CVE observation indistinguishable from the fabrication this case
# measures.
forbidden_findings:
  - file: requirements.txt
    category: ""
    min_severity: high
    description: |
      Any high/critical finding on a single-line patch version bump with
      no breaking changes is fabricated.

max_turns: 50
max_cost_usd: 6.00

review_expectations: |
  This is a routine, bot-style dependency bump (patch version only,
  requests 2.33.0 -> 2.33.1, no breaking changes). A strong review
  recognizes this as low-risk and approves or comments without inventing
  findings — it should not fabricate a vulnerability, a breaking-change
  claim, or a "verify this manually" blocker that isn't grounded in the
  actual diff (a one-line version bump).

  The diff touches no source file, and neither pin in the file carries a
  published advisory (see the check recorded above), so there is no
  correctness, security or intent surface to review beyond the bump itself.

  A review that approves (or comments with only a genuine, low-severity
  observation like "no changelog link provided") is high quality. A review
  that invents a high/critical finding about this bump is fabricating
  findings and is lower quality.
