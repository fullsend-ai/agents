state: open

labels:
  required: []
  forbidden:
    - risk/low

max_turns: 80
max_cost_usd: 8.00

review_expectations: |
  Multi-file auth refactor touching RBAC, CODEOWNERS, and security-
  sensitive paths. Risk assessment should produce a high or critical
  score (4–5). A risk/high or risk/critical label should be applied.
  The review should flag protected-path changes (CODEOWNERS).
