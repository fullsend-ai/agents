name: review-eval
description: >
  Functional test of the fullsend review agent pipeline. The label and
  decision judges measure the review's *outcome*; required_findings and
  forbidden_findings measure its *precision*, because outcome labels alone
  cannot tell a review that found the three seeded bugs from one that
  approved blindly, nor a review that dismissed FP bait from one that
  promoted it to a vulnerability. Only inspecting the findings themselves
  can.

skill: review

execution:
  mode: case
  timeout: 1200  # 20 min — agent timeout is 20 min, plus setup/teardown
  parallelism: 4
  env:
    EVAL_ORG: $EVAL_ORG
    GH_TOKEN: $GH_TOKEN
    FULLSEND_DIR: $FULLSEND_DIR
    GOOGLE_APPLICATION_CREDENTIALS: $GOOGLE_APPLICATION_CREDENTIALS
    ANTHROPIC_VERTEX_PROJECT_ID: $ANTHROPIC_VERTEX_PROJECT_ID
    GOOGLE_CLOUD_PROJECT: $GOOGLE_CLOUD_PROJECT
    CLOUD_ML_REGION: $CLOUD_ML_REGION
    # Per-run runtime/model/effort for A/B comparisons (run-functional.sh
    # exports them; empty = use the workspace config / harness values).
    EVAL_RUNTIME: $EVAL_RUNTIME
    EVAL_MODEL: $EVAL_MODEL
    EVAL_EFFORT: $EVAL_EFFORT

hooks:
  before_each:
    - command: "setup-fixture.sh"
      timeout: 120
      description: "Create ephemeral repo and fixture"

  after_each:
    - command: "capture-fixture.sh"
      timeout: 30
      description: "Capture fixture state for judges"
    - command: "teardown-fixture.sh"
      timeout: 30
      on_failure: continue
      description: "Delete ephemeral repo"

runner:
  type: cli
  command:
    - "run-fullsend.sh"
    - "{agent}"
    - "{workspace}"
    - "{output_dir}"
  env:
    FULLSEND_DIR: $FULLSEND_DIR
    GH_TOKEN: $GH_TOKEN
    GOOGLE_APPLICATION_CREDENTIALS: $GOOGLE_APPLICATION_CREDENTIALS
    ANTHROPIC_VERTEX_PROJECT_ID: $ANTHROPIC_VERTEX_PROJECT_ID
    GOOGLE_CLOUD_PROJECT: $GOOGLE_CLOUD_PROJECT
    CLOUD_ML_REGION: $CLOUD_ML_REGION
    # Per-run runtime/model/effort for A/B comparisons (run-functional.sh
    # exports them; empty = use the workspace config / harness values).
    EVAL_RUNTIME: $EVAL_RUNTIME
    EVAL_MODEL: $EVAL_MODEL
    EVAL_EFFORT: $EVAL_EFFORT

models:
  skill: claude-opus-4-6
  judge: claude-opus-4-6

dataset:
  path: cases
  schema: |
    Each case directory contains:
    - input.yaml: Fixture definition with forge, fixture type, title, body, and PR files.
    - annotations.yaml: Expected fixture state (labels, reviews, state) and,
      optionally, required_findings / forbidden_findings ground truth.
    - repo/: Directory (or symlink into ../../repos/) with the base repo
      contents (pushed to main before the PR).

outputs:
  - path: output
    schema: |
      fixture-state.json: Captured state of the GitHub PR after the
      full agent pipeline (pre-script, agent, post-script) has run.
      Contains: state, labels, comments, reviews, assignees,
      review_decision, and review_comments.

      review_comments is the PR's inline/file-level review comments — one
      per review finding, each {path, line, body}, captured by
      capture-fixture.sh from GET /repos/{repo}/pulls/{n}/comments. The
      `comments` array holds the agent's sticky top-level write-up; only
      review_comments holds the individual findings.

# ---------------------------------------------------------------------------
# Judges
# ---------------------------------------------------------------------------
judges:
  - name: review_quality
    description: |
      Evaluate the overall quality of the review — did the agent understand the
      change and produce a well-reasoned verdict?
    prompt: |
      You are evaluating a code review agent's work on a GitHub pull request.

      The agent was given a PR against a repo, and ran a full review pipeline:
      it read the diff and source code, analyzed the change, and posted a
      review with a verdict.

      Here is the captured state of the PR after the agent ran:
      {{ outputs }}

      Here is what the test case author expects from a good review of this
      specific PR:
      {{ annotations }}

      Evaluate the quality of the review on a 1-5 scale:

      1 = Wrong verdict or fundamentally misunderstood the change
      2 = Correct verdict but review comment is generic or shows no
          understanding of what changed
      3 = Adequate — correct verdict with a reasonable comment
      4 = Good — demonstrates understanding of the change and explains
          why the verdict is appropriate
      5 = Excellent — all of the above plus identifies specific strengths
          or mentions the test coverage

      Use the review_expectations field in the annotations as your rubric.

      Respond with just a number 1-5.

  - name: required_labels
    description: Required labels from annotations.yaml must be present
    check: |
      import json
      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found — capture-fixture.sh did not run or failed"
      state = json.loads(raw)
      actual = [l.lower() for l in state.get("labels", [])]
      required = outputs.get("annotations", {}).get("labels", {}).get("required", [])
      if not required:
          return True, "No required labels specified"
      missing = [l for l in required if l.lower() not in actual]
      if missing:
          return False, f"Missing labels: {missing} (actual: {actual})"
      return True, f"All required labels present: {required}"

  - name: forbidden_labels
    description: Labels listed in annotations.yaml forbidden list must NOT be present
    check: |
      import json
      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found — capture-fixture.sh did not run or failed"
      state = json.loads(raw)
      actual = [l.lower() for l in state.get("labels", [])]
      forbidden = outputs.get("annotations", {}).get("labels", {}).get("forbidden", [])
      if not forbidden:
          return True, "No forbidden labels specified"
      present = [l for l in forbidden if l.lower() in actual]
      if present:
          return False, f"Forbidden labels present: {present} (actual: {actual})"
      return True, f"No forbidden labels found (checked: {forbidden})"

  - name: risk_label_present
    description: When risk_label_required is set, at least one risk/* label must be present
    check: |
      import json
      required = outputs.get("annotations", {}).get("labels", {}).get("risk_label_required", False)
      if not required:
          return True, "risk_label_required not set — skipping"
      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found"
      state = json.loads(raw)
      actual = [l.lower() for l in state.get("labels", [])]
      risk_labels = [l for l in actual if l.startswith("risk/")]
      if not risk_labels:
          return False, f"No risk/* label found (actual: {actual})"
      return True, f"Risk label present: {risk_labels}"

  - name: required_findings
    if: "annotations.get('required_findings')"
    description: >
      Finding-level check for review precision. The outcome label and the
      review decision say whether the agent approved; neither can say
      whether it found the right things, so this judge inspects the
      findings themselves. annotations.required_findings is a list of
      {file, category, min_severity?, description?}; every entry must be
      satisfied by at least one finding the agent actually posted, read
      from fixture-state.json's review_comments (the PR's inline review
      comments, captured by capture-fixture.sh). A finding is recognised
      by the "**[severity]** category" header that formatFindingComment
      renders (fullsend internal/cli/postreview.go); the regex searches
      rather than anchors because the file-level fallback path in that
      same file prefixes the body with "_Line N_ · " when GitHub rejects a
      positioned comment. Bodies without that header are not findings and
      are skipped. `category` is matched against the whole comment body —
      the category token plus the description and remediation — not
      against the category token alone. The review agent's categories are
      fine-grained kebab-case tokens (injection-vuln, logic-error,
      stale-doc; see skills/pr-review/SKILL.md's per-dimension table), the
      output schema constrains them only to a non-empty string, and
      SKILL.md explicitly routes unrecognised categories to the nearest
      dimension — so a correct SQL-injection finding may arrive as
      injection-vuln or sql-injection with "SQL injection" appearing only
      in the description. Pinning the token alone would fail correct
      reviews on a synonym. Matching is word-boundary aware, so a required
      "injection" is not satisfied by a finding that only says
      "injections" and a forbidden "command" is not tripped by
      "commandeer" — case-insensitive substring matching is the bug class
      that let VerboseLoggingEnabled satisfy a VerboseLogging requirement
      in eval/code's removed_symbols judge. Boundaries use lookarounds
      rather than \b so a phrase with a non-word edge ("c++") still
      behaves, and internal whitespace is matched flexibly. An empty
      category means "any finding on this file". File paths compare exactly and
      case-sensitively (git paths are case-sensitive); lowercasing them
      would let a finding on Src/Auth.py satisfy a requirement on
      src/auth.py. Entries are validated up front — a non-list value, a
      non-mapping entry, a null/non-string file or category, an
      out-of-vocabulary min_severity, or an unknown key (a typo'd
      min_sevirity that would otherwise fall back to the default) fails
      the case with a message rather than silently degrading to a weaker
      check. A severity string outside info/low/medium/high/critical never
      satisfies a required entry (fail closed). Passes trivially when a
      case declares no required_findings. A missing review_comments key,
      a non-list value, or review_comments_fetch_failed all fail the case:
      an empty finding list would otherwise read as "the agent posted
      nothing" when the truth is "we could not look". Recall caveat when
      triaging a failure: postreview.go drops findings with no file or no
      line from the inline comments entirely, drops findings on files
      outside the PR diff, and on a GitHub 422 retries the review without
      inline comments — folding the findings into the review body, where
      neither comments endpoint sees them. A miss here can therefore be a
      posting-path artifact rather than a review miss; check the sticky
      comment in `comments` before blaming the agent.
    check: |
      import json
      import re

      SEVERITY_ORDER = {"info": 0, "low": 1, "medium": 2, "high": 3, "critical": 4}
      SEVERITY_NAMES = sorted(SEVERITY_ORDER, key=SEVERITY_ORDER.get)
      # search, not match: postreview.go's file-level fallback prefixes the
      # body with "_Line N_ · " ahead of the header.
      FINDING_RE = re.compile(r"\*\*\[([^\]\n]+)\]\*\*[ \t]*([^\n]*)")
      ALLOWED_KEYS = {"file", "category", "min_severity", "description"}

      entries = outputs.get("annotations", {}).get("required_findings")
      if not entries:
          return True, "No required_findings declared"
      if not isinstance(entries, list):
          return False, (
              "required_findings must be a list of {file, category, min_severity?}, "
              f"got {type(entries).__name__}"
          )
      # Validate before reading state: a null category or a typo'd
      # min_severity key would otherwise fall back to a default and
      # silently weaken the requirement into a near-unconditional pass.
      for i, e in enumerate(entries):
          if not isinstance(e, dict):
              return False, f"required_findings[{i}]: entry must be a mapping, got {type(e).__name__}"
          unknown = sorted(set(e) - ALLOWED_KEYS)
          if unknown:
              return False, f"required_findings[{i}]: unknown key(s) {unknown}, allowed {sorted(ALLOWED_KEYS)}"
          if not isinstance(e.get("file"), str) or not e["file"].strip():
              return False, f"required_findings[{i}]: file must be a non-empty string, got {e.get('file')!r}"
          if not isinstance(e.get("category"), str):
              return False, (
                  f"required_findings[{i}]: category must be a string "
                  f"(empty string matches any finding on the file), got {e.get('category')!r}"
              )
          sev = e.get("min_severity", "info")
          if not isinstance(sev, str) or sev.strip().lower() not in SEVERITY_ORDER:
              return False, f"required_findings[{i}]: min_severity must be one of {SEVERITY_NAMES}, got {sev!r}"

      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found — capture-fixture.sh did not run or failed"
      state = json.loads(raw)
      if state.get("review_comments_fetch_failed"):
          return False, "review_comments_fetch_failed — the agent's findings could not be read"
      comments = state.get("review_comments")
      if comments is None:
          return False, "review_comments missing from fixture-state.json — stale capture-fixture.sh?"
      if not isinstance(comments, list):
          return False, f"review_comments must be a list, got {type(comments).__name__}"

      def norm_path(p):
          p = (p or "").strip()
          return p[2:] if p.startswith("./") else p

      posted = []
      for c in comments:
          if not isinstance(c, dict):
              continue
          body = c.get("body") or ""
          m = FINDING_RE.search(body)
          if not m:
              continue  # not a finding: human note, or a non-finding agent comment
          posted.append({
              "file": norm_path(c.get("path")),
              "severity": m.group(1).strip().lower(),
              "category": m.group(2).strip(),
              "text": body,
          })
      # Diagnostics without the full bodies.
      summary = [{k: p[k] for k in ("file", "severity", "category")} for p in posted]

      def cat_matches(want, got):
          if not want:
              return True  # empty category: any finding on this file
          # Lookarounds, not \b: \b after a non-word edge ("c++") would
          # demand a following word character and never match.
          pat = r"(?<!\w)" + r"\s+".join(re.escape(t) for t in want.split()) + r"(?!\w)"
          return re.search(pat, got, re.I) is not None

      missing = []
      for e in entries:
          want_file = norm_path(e["file"])
          want_cat = e["category"].strip()
          floor = SEVERITY_ORDER[e.get("min_severity", "info").strip().lower()]
          # Unknown severity -> -1, so it never satisfies a requirement.
          if not any(
              p["file"] == want_file
              and SEVERITY_ORDER.get(p["severity"], -1) >= floor
              and cat_matches(want_cat, p["text"])
              for p in posted
          ):
              missing.append(
                  f"{e['file']} [{want_cat or 'any category'} >= {e.get('min_severity', 'info')}]"
              )

      if missing:
          return False, f"Missing required findings: {missing} (posted: {summary})"
      return True, f"All {len(entries)} required findings present"

  - name: forbidden_findings
    if: "annotations.get('forbidden_findings')"
    description: >
      The false-positive half of required_findings — same parsing, same
      word-boundary matching, same up-front validation and fail-closed
      rules (see that judge's description for the full contract). Every
      annotations.forbidden_findings entry names an FP-bait pattern that
      the agent must NOT flag: the case fails if any posted finding is on
      that file, matches the category, and is at or above the entry's
      min_severity. min_severity defaults to "high" here rather than
      "info", because a considered low/info note that the pattern was
      examined and dismissed is good reviewing, not a false positive —
      only promoting the bait to a real vulnerability is. An empty
      category forbids any finding on that file at or above the floor,
      which is how a docs-only or version-bump case asserts "invent
      nothing here". A severity string outside the known vocabulary is
      treated as a violation (fail closed) — the opposite direction from
      required_findings, and conservative in both.
    check: |
      import json
      import re

      SEVERITY_ORDER = {"info": 0, "low": 1, "medium": 2, "high": 3, "critical": 4}
      SEVERITY_NAMES = sorted(SEVERITY_ORDER, key=SEVERITY_ORDER.get)
      FINDING_RE = re.compile(r"\*\*\[([^\]\n]+)\]\*\*[ \t]*([^\n]*)")
      ALLOWED_KEYS = {"file", "category", "min_severity", "description"}

      entries = outputs.get("annotations", {}).get("forbidden_findings")
      if not entries:
          return True, "No forbidden_findings declared"
      if not isinstance(entries, list):
          return False, (
              "forbidden_findings must be a list of {file, category, min_severity?}, "
              f"got {type(entries).__name__}"
          )
      for i, e in enumerate(entries):
          if not isinstance(e, dict):
              return False, f"forbidden_findings[{i}]: entry must be a mapping, got {type(e).__name__}"
          unknown = sorted(set(e) - ALLOWED_KEYS)
          if unknown:
              return False, f"forbidden_findings[{i}]: unknown key(s) {unknown}, allowed {sorted(ALLOWED_KEYS)}"
          if not isinstance(e.get("file"), str) or not e["file"].strip():
              return False, f"forbidden_findings[{i}]: file must be a non-empty string, got {e.get('file')!r}"
          if not isinstance(e.get("category"), str):
              return False, (
                  f"forbidden_findings[{i}]: category must be a string "
                  f"(empty string forbids any finding on the file), got {e.get('category')!r}"
              )
          sev = e.get("min_severity", "high")
          if not isinstance(sev, str) or sev.strip().lower() not in SEVERITY_ORDER:
              return False, f"forbidden_findings[{i}]: min_severity must be one of {SEVERITY_NAMES}, got {sev!r}"

      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found — capture-fixture.sh did not run or failed"
      state = json.loads(raw)
      if state.get("review_comments_fetch_failed"):
          return False, "review_comments_fetch_failed — the agent's findings could not be read"
      comments = state.get("review_comments")
      if comments is None:
          return False, "review_comments missing from fixture-state.json — stale capture-fixture.sh?"
      if not isinstance(comments, list):
          return False, f"review_comments must be a list, got {type(comments).__name__}"

      def norm_path(p):
          p = (p or "").strip()
          return p[2:] if p.startswith("./") else p

      posted = []
      for c in comments:
          if not isinstance(c, dict):
              continue
          body = c.get("body") or ""
          m = FINDING_RE.search(body)
          if not m:
              continue
          posted.append({
              "file": norm_path(c.get("path")),
              "severity": m.group(1).strip().lower(),
              "category": m.group(2).strip(),
              "text": body,
          })

      def cat_matches(want, got):
          if not want:
              return True
          pat = r"(?<!\w)" + r"\s+".join(re.escape(t) for t in want.split()) + r"(?!\w)"
          return re.search(pat, got, re.I) is not None

      violations = []
      for e in entries:
          want_file = norm_path(e["file"])
          want_cat = e["category"].strip()
          floor = SEVERITY_ORDER[e.get("min_severity", "high").strip().lower()]
          for p in posted:
              # Unknown severity -> 99, so an unparseable severity still trips.
              if (
                  p["file"] == want_file
                  and SEVERITY_ORDER.get(p["severity"], 99) >= floor
                  and cat_matches(want_cat, p["text"])
              ):
                  violations.append({k: p[k] for k in ("file", "severity", "category")})

      if violations:
          return False, f"Forbidden findings present: {violations}"
      return True, f"None of the {len(entries)} forbidden findings were raised"

  - name: max_turns
    description: Agent must complete within the declared turn budget
    check: |
      import json
      raw = outputs["files"].get("output/metrics.json")
      if not raw:
          return False, "metrics.json not found"
      metrics = json.loads(raw)
      actual = metrics.get("num_turns")
      if actual is None:
          return False, "num_turns not present in metrics.json"
      limit = outputs.get("annotations", {}).get("max_turns")
      if limit is None:
          return False, "max_turns not declared in annotations.yaml"
      if int(actual) > int(limit):
          return False, f"Exceeded max_turns: {actual} > {limit}"
      return True, f"Turns OK: {actual} <= {limit}"

  - name: max_cost
    description: Agent must complete within the declared cost budget
    check: |
      import json
      raw = outputs["files"].get("output/metrics.json")
      if not raw:
          return False, "metrics.json not found"
      metrics = json.loads(raw)
      actual = metrics.get("total_cost_usd")
      if actual is None:
          return False, "total_cost_usd not present in metrics.json"
      limit = outputs.get("annotations", {}).get("max_cost_usd")
      if limit is None:
          return False, "max_cost_usd not declared in annotations.yaml"
      if float(actual) > float(limit):
          return False, f"Exceeded max_cost_usd: {actual} > {limit}"
      return True, f"Cost OK: {actual} <= {limit}"

# ---------------------------------------------------------------------------
# Thresholds
# ---------------------------------------------------------------------------
thresholds:
  review_quality:
    min_mean: 3.0
  required_labels:
    min_pass_rate: 1.0
  risk_label_present:
    min_pass_rate: 1.0
  forbidden_labels:
    min_pass_rate: 1.0
  # Both findings judges carry an `if:` so they are skipped — not counted
  # as passes — for cases that declare no findings ground truth. Without
  # it the rate is averaged over all five cases, and a case that declares
  # nothing passes trivially: required_findings at 0.70 could not fail
  # even if the only case with seeded bugs missed all of them.
  #
  # With today's case counts both gates resolve to "every case must pass":
  # two recall cases (004, 008) make 0, 0.5 and 1.0 the only reachable
  # rates, and three precision cases (005, 006, 007) make it 0, 0.33, 0.66
  # and 1.0. Neither threshold buys the slack its number suggests.
  #
  # That is deliberate for now. 008 is the anti-bait case — it exists to
  # catch a prompt change that over-suppresses — so allowing it to fail
  # while the suite stays green would make it decorative, which is the
  # exact defect these thresholds were fixed for. Revisit when the case
  # count grows; loosen recall before precision, since missing one seeded
  # bug is a known ceiling of today's agent while promoting bait to a real
  # vulnerability is the failure this suite exists to catch.
  required_findings:
    min_pass_rate: 0.70
  forbidden_findings:
    min_pass_rate: 0.9
  max_turns:
    min_pass_rate: 1.0
  max_cost:
    min_pass_rate: 1.0
