name: review-eval
description: Functional test of the fullsend review agent pipeline

skill: review

execution:
  mode: case
  # Harness hard-kill, above execution.env.EVAL_TIMEOUT so the script
  # timeout fires first. Sized to the functional-tests job's 45-minute cap
  # (as eval/code/eval.yaml), not to the harness's own 45-minute budget —
  # so the skill's time-budget checkpoints are not exercised here.
  timeout: 1800
  parallelism: 4
  env:
    # Script-level timeout for run-fullsend.sh; must live under
    # execution.env (runner.env is inert for type: cli). Under
    # execution.timeout so trap cleanup EXIT still runs.
    EVAL_TIMEOUT: "1700"
    EVAL_ORG: $EVAL_ORG
    GH_TOKEN: $GH_TOKEN
    FULLSEND_DIR: $FULLSEND_DIR
    GOOGLE_APPLICATION_CREDENTIALS: $GOOGLE_APPLICATION_CREDENTIALS
    ANTHROPIC_VERTEX_PROJECT_ID: $ANTHROPIC_VERTEX_PROJECT_ID
    GOOGLE_CLOUD_PROJECT: $GOOGLE_CLOUD_PROJECT
    CLOUD_ML_REGION: $CLOUD_ML_REGION
    # Per-run runtime/model/effort for A/B comparisons (run-functional.sh
    # exports them; empty = use the workspace config / harness values).
    EVAL_RUNTIME: $EVAL_RUNTIME
    EVAL_MODEL: $EVAL_MODEL
    EVAL_EFFORT: $EVAL_EFFORT

hooks:
  before_each:
    - command: "setup-fixture.sh"
      timeout: 120
      description: "Create ephemeral repo and fixture"

  after_each:
    - command: "capture-fixture.sh"
      timeout: 30
      description: "Capture fixture state for judges"
    - command: "teardown-fixture.sh"
      timeout: 30
      on_failure: continue
      description: "Delete ephemeral repo"

runner:
  type: cli
  command:
    - "run-fullsend.sh"
    - "{agent}"
    - "{workspace}"
    - "{output_dir}"
  env:
    FULLSEND_DIR: $FULLSEND_DIR
    GH_TOKEN: $GH_TOKEN
    GOOGLE_APPLICATION_CREDENTIALS: $GOOGLE_APPLICATION_CREDENTIALS
    ANTHROPIC_VERTEX_PROJECT_ID: $ANTHROPIC_VERTEX_PROJECT_ID
    GOOGLE_CLOUD_PROJECT: $GOOGLE_CLOUD_PROJECT
    CLOUD_ML_REGION: $CLOUD_ML_REGION
    # Per-run runtime/model/effort for A/B comparisons (run-functional.sh
    # exports them; empty = use the workspace config / harness values).
    EVAL_RUNTIME: $EVAL_RUNTIME
    EVAL_MODEL: $EVAL_MODEL
    EVAL_EFFORT: $EVAL_EFFORT

models:
  skill: claude-sonnet-5-5
  # The harness forces tool_choice to get a structured judge verdict.
  # The eval Vertex project's org policy
  # (constraints/vertexai.allowedPartnerModelFeatures) allows structured
  # outputs for claude-sonnet-5 but not yet for claude-sonnet-5-5, which
  # returns 400 on forced tool_choice. Move the judge to
  # claude-sonnet-5-5 once the policy lists
  # claude-sonnet-5-5:structured_outputs (agents#1603).
  judge: claude-sonnet-5

dataset:
  path: cases
  schema: |
    Each case directory contains:
    - input.yaml: Fixture definition with forge, fixture type, title, body, and PR files.
      PR fixtures may include followup_files, commit_message (default
      'eval: fixture changes'), plus prior_review body/provenance to exercise
      re-review behavior.
    - annotations.yaml: Expected fixture state (labels, reviews, state).
      findings.required requires every listed category; findings.required_any
      requires at least one listed category when non-empty. findings.forbidden
      rejects every listed category. review_expectations specifies which edits
      those findings must concern for the review_quality judge.
    - repo/: Directory with the base repo contents (pushed to main before the PR).

outputs:
  - path: output
    schema: |
      fixture-state.json: Captured state of the GitHub PR after the
      full agent pipeline (pre-script, agent, post-script) has run.
      Contains: state, labels, comments, reviews, assignees, and
      review_decision.

# ---------------------------------------------------------------------------
# Judges
# ---------------------------------------------------------------------------
judges:
  - name: review_quality
    # The rubric's scale. Declared, an off-scale score is recorded as a
    # judge error (counted by max_error_rate) instead of being accepted.
    score_range: [1, 5]
    description: |
      Evaluate the overall quality of the review — did the agent understand the
      change and produce a well-reasoned verdict?
    prompt: |
      You are evaluating a code review agent's work on a GitHub pull request.

      The agent was given a PR against a repo, and ran a full review pipeline:
      it read the diff and source code, analyzed the change, and posted a
      review with a verdict.

      Here is the captured state of the PR after the agent ran (fixture
      state capped at 50,000 characters, well under the judge model's
      input limit; a trailing marker appears if truncation happened):
      {{ outputs.files.get("output/fixture-state.json", "") | truncate(50000, True, "\n\n...[TRUNCATED: fixture state exceeded 50,000 characters]") }}

      Here is what the test case author expects from a good review of this
      specific PR:
      {{ annotations }}

      Evaluate the quality of the review on a 1-5 scale:

      1 = Wrong verdict or fundamentally misunderstood the change
      2 = Correct verdict but review comment is generic or shows no
          understanding of what changed
      3 = Adequate — correct verdict with a reasonable comment
      4 = Good — demonstrates understanding of the change and explains
          why the verdict is appropriate
      5 = Excellent — all of the above plus identifies specific strengths
          or mentions the test coverage

      Use the review_expectations field in the annotations as your rubric.

      Respond with just a number 1-5.

  - name: required_labels
    description: Required labels from annotations.yaml must be present
    check: |
      import json
      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found — capture-fixture.sh did not run or failed"
      state = json.loads(raw)
      actual = [l.lower() for l in state.get("labels", [])]
      required = outputs.get("annotations", {}).get("labels", {}).get("required", [])
      if not required:
          return True, "No required labels specified"
      missing = [l for l in required if l.lower() not in actual]
      if missing:
          return False, f"Missing labels: {missing} (actual: {actual})"
      return True, f"All required labels present: {required}"

  - name: forbidden_labels
    description: Labels listed in annotations.yaml forbidden list must NOT be present
    check: |
      import json
      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found — capture-fixture.sh did not run or failed"
      state = json.loads(raw)
      actual = [l.lower() for l in state.get("labels", [])]
      forbidden = outputs.get("annotations", {}).get("labels", {}).get("forbidden", [])
      if not forbidden:
          return True, "No forbidden labels specified"
      present = [l for l in forbidden if l.lower() in actual]
      if present:
          return False, f"Forbidden labels present: {present} (actual: {actual})"
      return True, f"No forbidden labels found (checked: {forbidden})"

  - name: finding_expectations
    description: Required findings must appear and forbidden findings must not appear
    check: |
      import json
      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found"
      state = json.loads(raw)
      bodies = [item.get("body", "") for item in state.get("comments", [])]
      bodies.extend(item.get("body", "") for item in state.get("reviews", []))
      review_text = "\n".join(bodies).lower()
      expected = outputs.get("annotations", {}).get("findings", {})
      required = [finding.lower() for finding in expected.get("required", [])]
      required_any = [finding.lower() for finding in expected.get("required_any", [])]
      forbidden = [finding.lower() for finding in expected.get("forbidden", [])]
      missing = [finding for finding in required if f"[{finding}]" not in review_text]
      missing_any = bool(required_any) and not any(
          f"[{finding}]" in review_text for finding in required_any
      )
      present = [finding for finding in forbidden if f"[{finding}]" in review_text]
      if missing or missing_any or present:
          return False, f"Finding mismatch: missing={missing}, missing_any={required_any if missing_any else []}, forbidden_present={present}"
      return True, f"Finding expectations met: required={required}, required_any={required_any}, forbidden={forbidden}"

  - name: risk_label_present
    description: When risk_label_required is set, at least one risk/* label must be present
    check: |
      import json
      required = outputs.get("annotations", {}).get("labels", {}).get("risk_label_required", False)
      if not required:
          return True, "risk_label_required not set — skipping"
      raw = outputs["files"].get("output/fixture-state.json")
      if not raw:
          return False, "fixture-state.json not found"
      state = json.loads(raw)
      actual = [l.lower() for l in state.get("labels", [])]
      risk_labels = [l for l in actual if l.startswith("risk/")]
      if not risk_labels:
          return False, f"No risk/* label found (actual: {actual})"
      return True, f"Risk label present: {risk_labels}"

  - name: max_cost
    description: Agent must complete within the declared cost budget
    check: |
      import json
      raw = outputs["files"].get("output/metrics.json")
      if not raw:
          return False, "metrics.json not found"
      metrics = json.loads(raw)
      actual = metrics.get("total_cost_usd")
      if actual is None:
          return False, "total_cost_usd not present in metrics.json"
      limit = outputs.get("annotations", {}).get("max_cost_usd")
      if limit is None:
          return False, "max_cost_usd not declared in annotations.yaml"
      if float(actual) > float(limit):
          return False, f"Exceeded max_cost_usd: {actual} > {limit}"
      return True, f"Cost OK: {actual} <= {limit}"

# ---------------------------------------------------------------------------
# Thresholds
# ---------------------------------------------------------------------------
# max_cost runs and reports but gates nothing: per-case cost varies run to
# run far more than any regression it has caught (none since 2026-08). There
# is no max_turns judge here: review's num_turns does not track the work done
# (identical runs, same tool calls and cost, report 2-9 or 37-64 turns).
thresholds:
  review_quality:
    min_mean: 3.0
    # Coverage gate: fail loudly if the judge errored on a chunk of the
    # dataset instead of letting min_mean silently average over survivors.
    # Off by default upstream; declared here since a too-large judge
    # prompt is exactly the kind of per-case error this guards against.
    max_error_rate: 0.2
  required_labels:
    min_pass_rate: 1.0
  risk_label_present:
    min_pass_rate: 1.0
  forbidden_labels:
    min_pass_rate: 1.0
  finding_expectations:
    min_pass_rate: 1.0
