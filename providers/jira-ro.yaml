---
# The sandbox gets this provider's placeholder, never the real token. The
# proxy swaps the placeholder in for either Jira auth mode the skills
# select: Basic (`--user email:token`) when JIRA_USER_EMAIL is set, Bearer
# (`--oauth2-bearer token`) when it is unset or empty. fullsend refuses
# FULLSEND_JIRA_TOKEN in provider credential values (fullsend#9079), so
# this keeps reading the JIRA_TOKEN secret. The host-side scripts use the
# FULLSEND_JIRA_* secrets through env.runner instead.
name: jira-ro
type: fullsend-jira-ro
credentials:
  JIRA_TOKEN: "${JIRA_TOKEN}"
