---
# Combined read-only GitHub API + artifact download profile.
# Used by agents that need both API access and artifact downloads
# under a single provider, avoiding credential key conflicts (#880).
# API endpoints mirror fullsend-github-ro.yaml — keep in sync.
# Artifact endpoints mirror fullsend-github-artifacts.yaml — keep in sync.
id: fullsend-github-ro-artifacts
display_name: Fullsend GitHub (read-only + artifacts)
description: Read-only GitHub API and artifact download access for fullsend agents
# Artifact endpoints were originally category: data — unified here
# under source_control since the provider is primarily GitHub API.
category: source_control
endpoints:
  - host: api.github.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: api.github.com
    port: 443
    protocol: graphql
    access: read-only
    enforcement: enforce
    path: "/graphql"
  - host: github.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: "*.blob.core.windows.net"
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: "*.actions.githubusercontent.com"
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
binaries:
  - "**/gh"
  - "**/node"
