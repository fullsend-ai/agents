---
# Endpoints mirror fullsend-gitlab-code.yaml — keep both in sync.
# This profile omits git/pre-commit binaries (API-only agents).
id: fullsend-gitlab-ro
display_name: Fullsend GitLab (read-only)
description: Read-only GitLab API access for fullsend agents
category: source_control
endpoints:
  - host: gitlab.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
    allow_encoded_slash: true
  # Red Hat internal GitLab — supported deployment target for enrolled repos
  - host: gitlab.cee.redhat.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
    allow_encoded_slash: true
binaries:
  - "**/curl"
  - "**/node"
