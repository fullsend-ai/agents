name: Vouch Check

# Closes PRs from unvouched first-time contributors (#1975). Runs on a
# schedule instead of pull_request_target, which GitHub blocks by default
# from 2026-12-02. pull_request cannot replace it: fork runs get a read-only
# token, and this repo requires approval for first-time contributors'
# pull_request runs, the population the gate targets. The job never checks
# out PR code; .github/scripts/vouch-sweep.sh reads PR metadata through the
# API and reads VOUCHED.td from fullsend-ai/fullsend's vouched branch.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what would be closed without changing anything
        type: boolean
        default: false

permissions: {}

concurrency:
  group: vouch-check
  cancel-in-progress: false

jobs:
  vouch-gate:
    if: github.repository_owner == 'fullsend-ai'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Close PRs from unvouched contributors
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          # shellcheck disable=SC2086 # DRY_RUN is empty or one flag
          bash .github/scripts/vouch-sweep.sh ${DRY_RUN} "${REPO}"
