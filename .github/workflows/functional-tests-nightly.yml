name: Functional Tests (nightly)

# Nightly full-suite run against fullsend main (#1573). The fullsend release
# gate runs only the release tier, so the model-quality and budget judges are
# exercised here. Kept out of functional-tests.yml on purpose: a reusable
# workflow's callers must grant every permission any of its jobs requests,
# so an issues: write job there would break fullsend's release gate at its
# next pin bump. Calling it from here also gives the nightly its own
# concurrency group.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  run:
    if: github.repository == 'fullsend-ai/agents'
    uses: ./.github/workflows/functional-tests.yml
    with:
      tier: full
    secrets: inherit
    # Union of what functional-tests.yml's jobs request.
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      checks: read

  aggregate:
    # Nightly verdict over the last 3 nightly runs (#1601): the behaviour
    # checks and quality judges are report-only in a single run, so this job
    # fails the nightly only when a case fails a check in 2 of the last 3
    # runs, or a quality judge's median of 3 misses its threshold. The
    # previous runs are the last two completed scheduled runs on main.
    needs: run
    if: >-
      always() &&
      github.repository == 'fullsend-ai/agents' &&
      needs.run.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Aggregate the last 3 nightly runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          RESULTS="${RUNNER_TEMP}/nightly-results"
          mkdir -p "$RESULTS"
          # This run first, then the last two completed scheduled runs on
          # main, never this run itself (a re-run is listed as completed).
          PREVIOUS="$(gh run list --repo "$REPO" --workflow functional-tests-nightly.yml \
            --branch main --event schedule --status completed --limit 3 \
            --json databaseId --jq "[.[].databaseId | select(. != ${RUN_ID})][:2][]")"
          RUNS="$RUN_ID $PREVIOUS"
          echo "Runs, newest first: $RUNS"

          failed=0
          for eval_yaml in eval/*/eval.yaml; do
            agent="$(basename "$(dirname "$eval_yaml")")"
            summaries=()
            for run in $RUNS; do
              dir="${RESULTS}/${run}/${agent}"
              mkdir -p "$dir"
              # A run without this agent's results (cancelled, or the agent
              # never ran) is simply left out.
              if gh run download "$run" --repo "$REPO" --name "eval-results-${agent}" --dir "$dir" >/dev/null 2>&1; then
                # One run directory per agent; take the newest if a retry
                # left more than one.
                summary="$(find "$dir" -name summary.yaml -path "*/${agent}/*" | sort -r | head -n 1)"
                if [ -n "$summary" ]; then
                  summaries+=("$summary")
                fi
              fi
            done
            echo "::group::${agent} (${#summaries[@]} run(s))"
            if [ "${#summaries[@]}" -eq 0 ]; then
              echo "No summary for ${agent}; skipped"
              echo "::endgroup::"
              continue
            fi
            rc=0
            bash eval/scripts/aggregate-nightly.sh "$eval_yaml" "${summaries[@]}" || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 1 ]; then
              echo "::error::${agent}: nightly verdict FAIL (see the step summary)"
              failed=1
            elif [ "$rc" -ne 0 ]; then
              echo "::error::${agent}: aggregate-nightly.sh exited ${rc}"
              failed=1
            fi
          done
          exit "$failed"

  report:
    needs: [run, aggregate]
    # Only main-health runs report; a manual dispatch from a feature branch
    # must not comment on the tracking issue.
    if: >-
      always() &&
      github.repository == 'fullsend-ai/agents' &&
      github.ref == 'refs/heads/main' &&
      (needs.run.result != 'success' || needs.aggregate.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report nightly failure
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ needs.run.result }}
          VERDICT: ${{ needs.aggregate.result }}
        run: |
          TITLE="Nightly functional tests failing"
          BODY="Nightly full-suite run ended with result '${RESULT}', 3-run verdict '${VERDICT}': ${RUN_URL}"
          # Only issues this workflow opened, so a look-alike issue opened by
          # anyone else is never commented on.
          NUMBER=$(gh issue list --repo "$REPO" --state open --author app/github-actions \
            --search "\"${TITLE}\" in:title" \
            --json number,title --jq "map(select(.title == \"${TITLE}\"))[0].number // empty")
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
          fi
